    if (!boss.alive) { onBossDefeated(); }
  }

  // Room entry protection timer
  if (roomEntryTimer > 0) {
    roomEntryTimer -= dt;
    // Freeze enemies during protection — they can't move or attack
    if (roomEntryTimer > 0) {
      enemies.forEach(e => { e.frozen = true; });
    } else {
      enemies.forEach(e => { e.frozen = false; });
    }
  }

  // Turret update
  for (let i = turrets.length - 1; i >= 0; i--) {
    const t = turrets[i];
    t.timer -= dt;
    if (t.timer <= 0) { turrets.splice(i, 1); continue; }
    // Find nearest enemy in range
    let nearest = null, nearestDist = 250;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) { nearestDist = dist; nearest = e; }
    }
    // Also target boss
    if (boss && boss.alive) {
      const dx = boss.x - t.x, dy = boss.y - t.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) { nearestDist = dist; nearest = boss; }
    }
    if (nearest) {
      t.angle = Math.atan2(nearest.y - t.y, nearest.x - t.x);
      t.fireTimer -= dt;
      if (t.fireTimer <= 0) {
        t.fireTimer = t.fireRate;
        spawnBullet(t.x, t.y, t.angle, 'pistol', 'fire');
      }
    }
  }

  // Enemy update
  enemies.forEach(e => { if (!e.frozen) e.update(dt); });
  enemies = enemies.filter(e => e.alive);
  updateEnemyBullets(dt);
  // Collisions
  checkBulletEnemyCollisions();
  checkEnemyPlayerCollision(dt);
  checkEnemyBulletPlayerCollision();
  // Room cleared check (combat rooms only; boss handled by onBossDefeated)
  const room = getCurrentRoom();
  if (room && room.type === ROOM_TYPE.COMBAT && !room.cleared && enemies.filter(e => e.alive).length === 0) {
    room.cleared = true;
    // Room clear celebration!
    spawnParticles(room.cx, room.cy, '#ffdd00', 20);
    spawnParticles(room.cx, room.cy, '#ff8800', 15);
    flashScreen(0.1);
    floatingTexts.push({x: room.cx, y: room.cy - 30, text: '清除! ✨', life: 1.5, color: '#ffdd00', vy: -40});
    // Use TUNING drop chances
    if (Math.random() < TUNING.dropChanceWeapon) {
      spawnRandomWeapon(room.cx, room.cy);
    } else if (Math.random() < TUNING.dropChanceHeart) {
      spawnDrop(room.cx, room.cy, 'heart');
    } else if (Math.random() < TUNING.dropChanceCoin) {
      spawnDrop(room.cx, room.cy, 'coin_pile');
    }
  }

  // Game over check
  if (player.hp <= 0 && gameState !== STATE.GAMEOVER && gameState !== STATE.VICTORY) {
    gameState = STATE.GAMEOVER;
    saveHighScore();
    drops = [];
    shopItems = [];
    boss = null;
    bossBullets = [];
    bossClones = [];
    tentacleZones = [];
    sporeZones = [];
    lightningPillars = [];
    stoneWalls = [];
    bossQueue = [];
  }

  camera.update(dt);
  updateParticles(dt);
  // Update lightning bolts
  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    lightningBolts[i].life -= dt;
    if (lightningBolts[i].life <= 0) lightningBolts.splice(i, 1);
  }
  // Update floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.life -= dt; ft.y += (ft.vy || -50) * dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  // Update muzzle flashes
  for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
    muzzleFlashes[i].life -= dt;
    if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
  }
  } // end game simulation if-block
}
// === RENDER FUNCTIONS ===

function renderHUD(ctx) {
  // Top bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, GW, 44);

  // HP hearts
  ctx.font = '20px monospace';
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillText(i < player.hp ? '❤️' : '🖤', 12 + i * 28, 30);
  }

  // Coins & character info
  ctx.fillStyle = '#ffdd00';
  ctx.fillText('💰 ' + player.coins, 12 + player.maxHp * 28 + 20, 30);
  const cd2 = CHARACTERS[player.charClass];
  ctx.fillStyle = cd2.color;
  ctx.fillText(cd2.emoji + ' ' + cd2.name + ' | ' + cd2.passive.name + ': ' + cd2.passive.desc, GW/2 - 160, 30);
  ctx.fillStyle = '#aaccff';
  ctx.fillText('第' + (dungeon?.floorNum || '?') + '层', GW - 150, 30);

  // Bottom bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, GH - 60, GW, 60);

  // Current weapon
  const wp = player.getWeapon();
  if (wp) {
    const wData = WEAPONS[wp.type];
    const affixName = wp.affix ? AFFIXES[wp.affix].name : '';
    ctx.fillStyle = wp.affix ? AFFIXES[wp.affix].color : '#ffffff';
    ctx.fillText('[1] ' + affixName + wData.name + ' ' + wData.emoji, 16, GH - 30);
  }
  // Other weapon
  if (player.weapons.length > 1) {
    const otherIdx = player.currentWeapon === 0 ? 1 : 0;
    const wp2 = player.weapons[otherIdx];
    const wData2 = WEAPONS[wp2.type];
    const affixName2 = wp2.affix ? AFFIXES[wp2.affix].name : '';
    const slotLabel = otherIdx === 0 ? '[1]' : '[2]';
    ctx.fillText(slotLabel + ' ' + affixName2 + wData2.name + ' ' + wData2.emoji, 16, GH - 10);
  }

  // Skill status
  const cd = CHARACTERS[player.charClass];
  const ready = player.skillTimer <= 0;
  ctx.fillStyle = ready ? '#00ff88' : '#ff4444';
  ctx.fillText('[Space] ' + cd.skillName + ' ' + (ready ? '✅' : Math.ceil(player.skillTimer)+'s'), GW - 260, GH - 20);
  // Bow charge indicator
  const wp2 = player.getWeapon();
  if (wp2 && WEAPONS[wp2.type] && WEAPONS[wp2.type].type === 'charged' && player.chargeTimer > 0) {
    const chargePct = Math.min(1, player.chargeTimer / 1.2);
    ctx.fillStyle = '#222222';
    ctx.fillRect(GW - 260, GH - 48, 120, 12);
    ctx.fillStyle = chargePct >= 1 ? '#ffdd00' : '#ff8800';
    ctx.fillRect(GW - 260, GH - 48, 120 * chargePct, 12);
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px monospace';
    ctx.fillText(chargePct >= 1 ? '🔴 MAX' : '🏹 ' + Math.floor(chargePct*100) + '%', GW - 255, GH - 38);
  }
}

function renderMinimap(ctx) {
  if (!dungeon) return;
  const mmX = minimapExpanded ? GW/2 - 300 : GW - 220;
  const mmY = minimapExpanded ? GH/2 - 225 : 50;
  const mmW = minimapExpanded ? 600 : 205;
  const mmH = minimapExpanded ? 450 : 155;
  // Background with border glow
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  ctx.strokeStyle = '#556688';
  ctx.lineWidth = 2;
  ctx.strokeRect(mmX, mmY, mmW, mmH);
  // Title
  ctx.fillStyle = '#8899aa';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('地 图', mmX + mmW/2, mmY - 6);
  ctx.textAlign = 'start';

  const cellW = mmW / GRID_COLS, cellH = mmH / GRID_ROWS;
  const typeLabels = { start: '起点', combat: '战斗', chest: '宝箱', shop: '商店', boss: 'BOSS' };
  for (const room of dungeon.rooms) {
    const rx = mmX + room.gridX * cellW + 2;
    const ry = mmY + room.gridY * cellH + 2;
    if (room.explored) {
      ctx.fillStyle = room.type === ROOM_TYPE.BOSS ? '#ff3333' :
                      room.type === ROOM_TYPE.SHOP ? '#ffcc00' :
                      room.type === ROOM_TYPE.CHEST ? '#44ccff' : '#445566';
      ctx.fillRect(rx, ry, cellW - 4, cellH - 4);
      // Room label text
      if (cellW > 40) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `${Math.floor(cellH*0.35)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(typeLabels[room.type] || '', rx + (cellW-4)/2, ry + (cellH-4)/2 + 5);
        ctx.textAlign = 'start';
      }
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(rx, ry, cellW - 4, cellH - 4);
    }
    if (room.id === currentRoomIdx) {
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3;
      ctx.strokeRect(rx - 1, ry - 1, cellW - 2, cellH - 2);
    }
    // Show door connections between explored rooms
    if (room.explored && cellW > 40) {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      for (const door of room.doors) {
        const tr = getRoom(door.targetRoomId);
        if (tr && tr.explored) {
          ctx.beginPath();
          ctx.moveTo(rx + (cellW-4)/2, ry + (cellH-4)/2);
          const tx = mmX + tr.gridX * cellW + 2 + (cellW-4)/2;
          const ty = mmY + tr.gridY * cellH + 2 + (cellH-4)/2;
          ctx.lineTo(tx, ty);
          ctx.stroke();
        }
      }
    }
  }
}

function renderGameOver(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, GW, GH);
  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#ff4444';
  ctx.textAlign = 'center';
  ctx.fillText('阵 亡', GW/2, 250);
  ctx.font = '18px monospace';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText('到达: 第' + (dungeon?.floorNum||1) + '层 | 金币: ' + player.coins, GW/2, 310);
  ctx.fillText('按 Enter 返回菜单', GW/2, 380);
  ctx.textAlign = 'start';
}

function renderVictory(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, GW, GH);
  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#ffdd00';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 胜 利 🏆', GW/2, 250);
  ctx.font = '18px monospace';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText('击败了暗影领主! 金币: ' + player.coins, GW/2, 310);
  ctx.fillText('按 Enter 返回菜单', GW/2, 380);
  ctx.textAlign = 'start';
}

function render() {
  ctx.clearRect(0, 0, GW, GH);

  // === DISPATCH BY GAME STATE ===
  if (gameState === STATE.MENU) {
    renderMenu(ctx);
    return;
  }
  if (gameState === STATE.CHAR_SELECT) {
    renderCharSelect(ctx);
    return;
  }

  // === GAMEPLAY STATES: PLAYING, BOSS, SHOP, GAMEOVER, VICTORY, PAUSED ===
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, GW, GH);

  // Camera-transformed game rendering
  camera.applyTransform(ctx);
  // Draw dungeon room
  renderRoom(ctx, getCurrentRoom());
  // Render corridors between explored rooms
  if (dungeon && dungeon.corridors) {
    for (const cor of dungeon.corridors) {
      const rA = getRoom(cor.from), rB = getRoom(cor.to);
      if (!rA || !rB) continue;
      if (!rA.explored && !rB.explored) continue;
      // Draw corridor path
      ctx.strokeStyle = '#2a2a3e';
      ctx.lineWidth = Math.min(ROOM_W, ROOM_H) * 0.15;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rA.cx, rA.cy);
      ctx.lineTo(rB.cx, rB.cy);
      ctx.stroke();
      ctx.lineCap = 'butt';
      // Center line (lighter)
      ctx.strokeStyle = '#3a3a4e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(rA.cx, rA.cy);
      ctx.lineTo(rB.cx, rB.cy);
      ctx.stroke();
      // Floor dots along corridor
      ctx.fillStyle = '#444466';
      const len = Math.sqrt((rB.cx-rA.cx)**2 + (rB.cy-rA.cy)**2);
      const steps = Math.floor(len / 40);
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        ctx.beginPath();
        ctx.arc(rA.cx + (rB.cx-rA.cx)*t, rA.cy + (rB.cy-rA.cy)*t, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  // Render enemies and enemy bullets
  enemies.forEach(e => e.render(ctx));
  // Render turrets
  for (const t of turrets) {
    ctx.save(); ctx.translate(t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillRect(-t.radius, -t.radius, t.radius*2, t.radius*2);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.strokeRect(-t.radius, -t.radius, t.radius*2, t.radius*2);
    // Turret barrel
    if (t.angle !== undefined) {
      ctx.strokeStyle = '#ffdd00'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(18, 0); ctx.stroke();
    }
    ctx.restore();
  }
  renderEnemyBullets(ctx);
  player.render(ctx);
  renderBullets(ctx);

  // Boss rendering
  if (boss && boss.alive && gameState === STATE.BOSS) {
    renderBossBullets(ctx);
    renderTentacleZones(ctx);
    renderSporeZones(ctx);
    renderLightningPillars(ctx);
    renderStoneWalls(ctx);
    renderBossClones(ctx);
    boss.render(ctx);
  }

  // Drops rendering
  for (const d of drops) {
    if (d.life <= 0) continue;
    ctx.save();
    const bob = Math.sin(Date.now() / 400 + d.x * 0.1) * 3; // bobbing
    const pulse = 1 + Math.sin(Date.now() / 250 + d.x * 0.05) * 0.08;
    ctx.translate(d.x, d.y + bob);
    ctx.scale(pulse, pulse);

    // Glow aura underneath
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
    glow.addColorStop(0, (d.color || '#ffffff') + '66');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 10, 10, 4, 0, 0, Math.PI*2); ctx.fill();

    // Item emoji
    ctx.font = (20 * pulse) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = d.color || '#ffffff';
    ctx.globalAlpha = Math.min(d.life / 5, 1);
    ctx.fillText(d.emoji || '?', 0, -2);

    // Weapon name label
    if (d.type === 'weapon' && d.name) {
      ctx.font = 'bold 10px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = Math.min(d.life / 5, 1) * 0.8;
      ctx.fillText(d.name, 0, 16);
    }
    ctx.restore();
  }

  renderParticles(ctx);
  // Render floating texts
  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, ft.life / 0.5);
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }
  // Render muzzle flashes
  for (const mf of muzzleFlashes) {
    const alpha = mf.life / 0.08;
    const r = 12 * alpha;
    const grad2 = ctx.createRadialGradient(mf.x, mf.y, 0, mf.x, mf.y, r);
    grad2.addColorStop(0, '#ffffff');
    grad2.addColorStop(0.4, mf.color);
    grad2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.arc(mf.x, mf.y, r, 0, Math.PI*2); ctx.fill();
  }
  // Render lightning bolts
  for (const lb of lightningBolts) {
    ctx.strokeStyle = '#ffdd00';
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = lb.life / 0.3;
    ctx.beginPath(); ctx.moveTo(lb.x1, lb.y1); ctx.lineTo(lb.x2, lb.y2); ctx.stroke();
    // Glow
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lb.x1, lb.y1); ctx.lineTo(lb.x2, lb.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  camera.restore(ctx);

  // === SCREEN-SPACE UI ===
  renderHUD(ctx);
  renderMinimap(ctx);

  // Room entry protection overlay
  if (roomEntryTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, GW, GH);
    ctx.fillStyle = '#88ccff';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🛡️ 房间保护: ' + roomEntryTimer.toFixed(1) + 's', GW/2, GH/2 + 40);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaddff';
    ctx.fillText('敌人已冻结 · 准备迎战!', GW/2, GH/2 + 80);
    ctx.textAlign = 'start';
  }

  // Boss HP bar (top-center)
  if (boss && boss.alive && gameState === STATE.BOSS) {
    const barW = 300, barH = 16, barX = GW/2 - barW/2, barY = 12;
    ctx.fillStyle = '#333333';
    ctx.fillRect(barX, barY, barW, barH);
    const hpRatio = boss.hp / boss.maxHp;
    ctx.fillStyle = hpRatio > 0.3 ? '#ff4444' : '#ff0000';
    ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(boss.name + ' ' + Math.ceil(boss.hp) + '/' + boss.maxHp, GW/2, barY + 13);
  }

  // === SHOP UI ===
  if (gameState === STATE.SHOP) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, GW, GH);

    ctx.fillStyle = '#ffcc00';
    ctx.font = '26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('=== 商店 SHOP ===', GW/2, 70);

    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('💰 ' + player.coins, GW/2, 100);

    const startY = 140;
    const itemH = 70;
    for (let i = 0; i < shopItems.length; i++) {
      const si = shopItems[i];
      const iy = startY + i * itemH;

      // Item background
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(GW/2 - 180, iy, 360, itemH - 6);

      // Emoji + Name
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.font = '18px monospace';
      ctx.fillText(si.emoji + ' ' + si.name, GW/2 - 160, iy + 30);

      // Price
      ctx.textAlign = 'right';
      ctx.fillStyle = player.coins >= si.price ? '#ffcc00' : '#ff4444';
      ctx.fillText(si.price + '💰', GW/2 + 160, iy + 30);

      // Key hint
      ctx.textAlign = 'center';
      ctx.fillStyle = '#888888';
      ctx.font = '13px monospace';
      ctx.fillText('按 ' + (i+1) + ' 键购买', GW/2, iy + 55);
    }

    // Close hint
    ctx.fillStyle = '#888888';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('按 E 或 Esc 关闭', GW/2, GH - 50);
  }

  // === GAME OVER OVERLAY ===
  if (gameState === STATE.GAMEOVER) {
    renderGameOver(ctx);
  }

  // === VICTORY OVERLAY ===
  if (gameState === STATE.VICTORY) {
    renderVictory(ctx);
  }

  // === PAUSED OVERLAY ===
  if (gameState === STATE.PAUSED) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, GW, GH);
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停', GW/2, GH/2 - 10);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#888888';
    ctx.fillText('按 Esc 继续', GW/2, GH/2 + 30);
  }

  // === UI OVERLAYS ===
  // Screen flash (white overlay)
  if (flashAlpha > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(flashAlpha, 0.8) + ')';
    ctx.fillRect(0, 0, GW, GH);
  }

  // Message queue (center screen)
  if (messageQueue.length > 0) {
    const msg = messageQueue[0];
    ctx.fillStyle = '#ffcc00';
    ctx.font = '18px monospace';
    ctx.textAlign = 'center';
    const msgAlpha = Math.min(msg.timer, 0.5) / 0.5;
    ctx.globalAlpha = msgAlpha;
    ctx.fillText(msg.text, GW/2, GH/2 - 30);
    ctx.globalAlpha = 1;
  }

  // Slow effect indicator
  if (slowTimer > 0) {
    ctx.fillStyle = 'rgba(136,204,255,0.15)';
    ctx.fillRect(0, 0, GW, GH);
  }
}

// === GAME INIT ===
function initGame() {
  // Initialize a new game run with dungeon generation
  bullets = [];
  enemyBullets = [];
  enemies = [];
  bossBullets = [];
  bossClones = [];
  tentacleZones = [];
  sporeZones = [];
  lightningPillars = [];
  stoneWalls = [];
  boss = null;
  bossQueue = [];
  roomEntryTimer = 0;
  turrets = [];
  dungeon = generateFloor(1);
  currentRoomIdx = dungeon.startRoomId;
  gameState = STATE.PLAYING;
  drops = [];
  shopItems = [];
  enterRoom(currentRoomIdx);
  console.log('Dungeon generated:', dungeon);
}

// Start at main menu
gameState = STATE.MENU;
requestAnimationFrame(gameLoop);
console.log('Pixel Knight — ready');
</script>
