function spawnBullet(x, y, angle, wType, affixKey) {
  const wData = WEAPONS[wType];

  // Melee attack — instant hit check in an arc in front of player
  if (wData.type === 'melee') {
    const meleeRange = 40;
    const meleeAngle = Math.PI;
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const dx = enemy.x - x, dy = enemy.y - y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const hitAngle = Math.atan2(dy, dx);
      let angleDiff = hitAngle - angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
      if (dist < meleeRange && Math.abs(angleDiff) < meleeAngle/2) {
        enemy.takeDamage(wData.damage * player.buffs.damageMult);
        // Apply affix on melee hit
        if (affixKey) {
          switch (affixKey) {
            case 'fire': enemy.state.burning = { timer: 3.0, dps: 3 }; break;
            case 'ice': enemy.state.slowed = { timer: 2.0, factor: 0.4 }; break;
            case 'poison':
              enemy.state.poisonStacks = (enemy.state.poisonStacks || 0) + 1;
              if (enemy.state.poisonStacks >= 3) { enemy.takeDamage(15); enemy.state.poisonStacks = 0; spawnParticles(enemy.x, enemy.y, '#44ff44', 6); }
              break;
            case 'explosive':
              for (const e2 of enemies) {
                if (e2 !== enemy && e2.alive) {
                  const dx2 = enemy.x - e2.x, dy2 = enemy.y - e2.y;
                  if (Math.sqrt(dx2*dx2+dy2*dy2) < 60) e2.takeDamage(wData.damage * player.buffs.damageMult * 0.5);
                }
              }
              spawnParticles(enemy.x, enemy.y, '#ff4400', 8);
              break;
            case 'knockback':
              const kdx = enemy.x - x, kdy = enemy.y - y;
              const kdist = Math.sqrt(kdx*kdx+kdy*kdy) || 1;
              enemy.x += (kdx/kdist) * 60;
              enemy.y += (kdy/kdist) * 60;
              break;
            case 'lightning': enemy.state.lightningMark = true; break;
            case 'lifesteal': player.hp = Math.min(player.maxHp, player.hp + 0.5); break;
          }
        }
      }
    }
    // Also destroy nearby enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      const dx = eb.x - x, dy = eb.y - y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < meleeRange) enemyBullets.splice(i, 1);
    }
    // Hit boss if in range
    if (boss && boss.alive) {
      const bdx = boss.x - x, bdy = boss.y - y;
      if (Math.sqrt(bdx*bdx + bdy*bdy) < meleeRange + boss.radius) {
        boss.takeDamage(wData.damage * player.buffs.damageMult);
      }
    }
    // Visual: spawn arc particles
    for (let i = 0; i < 8; i++) {
      const pa = angle - meleeAngle/2 + (i/7) * meleeAngle;
      particles.push({x: x + Math.cos(pa)*meleeRange, y: y + Math.sin(pa)*meleeRange, vx:0, vy:0, life:0.2, maxLife:0.2, color:'#ffffff', radius:3});
    }
    return; // Don't create a bullet
  }

  const spawned = [];
  const count = wData.count || 1;
  for (let i = 0; i < count; i++) {
    const spreadAngle = angle + (Math.random() - 0.5) * wData.spread * 2;
    const bullet = {
      x, y,
      vx: Math.cos(spreadAngle) * wData.speed,
      vy: Math.sin(spreadAngle) * wData.speed,
      weapon: wType, affix: affixKey,
      damage: wData.damage * player.buffs.damageMult * (Math.random() < (player.critChance || 0) ? 2.5 : 1),
      pierce: wData.pierce + player.buffs.pierce,
      color: affixKey ? AFFIXES[affixKey].color : wData.color,
      life: 3,
      bounce: wData.bounces || 0,
      isMelee: wType === 'sword',
      arc: wData.arc || 0,
      isBeam: wType === 'laser',
      poisonStacks: {}
    };
    bullets.push(bullet);
    spawned.push(bullet);
  }
  return spawned;
}

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / GW, window.innerHeight / GH);

  canvas.style.height = (GH * scale) + 'px';
}

const keys = {};
const mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0 };
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GW / rect.width;
  const scaleY = GH / rect.height;
  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
  const wp = camera.screenToWorld(mouse.x, mouse.y);
  mouse.worldX = wp.x; mouse.worldY = wp.y;
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GW / rect.width;
  const scaleY = GH / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  // MENU: click play button (centered, 200x50 at y=300)
  if (gameState === STATE.MENU) {
    if (cx > GW/2 - 100 && cx < GW/2 + 100 && cy > 300 && cy < 350) {
      SFX.menuSelect();
      gameState = STATE.CHAR_SELECT;
      return; // Prevent same click from triggering character select
    }
  }
  // CHAR_SELECT: click character cards
  if (gameState === STATE.CHAR_SELECT) {
    const chars = Object.entries(CHARACTERS);
    chars.forEach(([key, data], i) => {
      const cardX = GW/6 * (i+1);
      const cardY = 370;
      if (cx > cardX - 70 && cx < cardX + 70 && cy > cardY - 130 && cy < cardY + 130) {
        SFX.menuSelect();
        player.init(key);
        initGame();
        gameState = STATE.PLAYING;
      }
    });
  }
});

// === CAMERA ===
const camera = {
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  shakeAmount: 0, shakeDecay: 4,
  update(dt) {
    // Smooth follow
    this.x += (this.targetX - this.x) * 8 * dt;
    this.y += (this.targetY - this.y) * 8 * dt;
    this.shakeAmount = Math.max(0, this.shakeAmount - this.shakeDecay * dt);
  },
  shake(amount) { this.shakeAmount = Math.max(this.shakeAmount, amount); },
  applyTransform(ctx) {
    ctx.save();
    let sx = this.shakeAmount * (Math.random() * 2 - 1);
    let sy = this.shakeAmount * (Math.random() * 2 - 1);
    ctx.translate(GW/2 - this.x + sx, GH/2 - this.y + sy);
  },
  restore(ctx) { ctx.restore(); },
  worldToScreen(wx, wy) {
    return {
      x: GW/2 + (wx - this.x),
      y: GH/2 + (wy - this.y)
    };
  },
  screenToWorld(sx, sy) {
    return {
      x: this.x + (sx - GW/2),
      y: this.y + (sy - GH/2)
    };
  }
};

const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  radius: 14, angle: 0,
  charClass: 'knight',
  speed: 200,
  hp: 5, maxHp: 5,
  skillTimer: 0, skillCooldown: 10,
  weapons: [], currentWeapon: 0,
  coins: 0,
  buffs: { damageMult: 1, speedMult: 1, pierce: 0, hpBonus: 0 },
  invincible: 0,

  init(chosenClass) {
    const data = CHARACTERS[chosenClass];
    this.charClass = chosenClass;
    this.speed = data.speed;
    this.maxHp = data.hp + (data.passive.hpBonus || 0);
    this.hp = this.maxHp;
    this.skillCooldown = data.skillCD - (data.passive.skillCDReduction || 0);
    this.skillTimer = 0;
    this.coins = 0;
    this.buffs = {
      damageMult: data.passive.damageMult || 1,
      speedMult: data.passive.speedMult || 1,
      pierce: data.passive.pierceBonus || 0,
      hpBonus: data.passive.hpBonus || 0,
      lifesteal: data.passive.lifesteal || 0
    };
    this.fireRateMult = data.passive.fireRateMult || 1;
    this.critChance = data.passive.critChance || 0;
    this.invincible = 0;
    // Character-specific starting weapon
    this.weapons = [{ type: data.startWeapon, affix: null }];
    this.currentWeapon = 0;
    this.fireTimer = 0;
    this.burstIndex = 0;
    this.burstTimer = 0;
  },

  update(dt) {
    // Movement
    this.vx = 0; this.vy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) this.vy = -1;
    if (keys['KeyS'] || keys['ArrowDown']) this.vy = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) this.vx = -1;
    if (keys['KeyD'] || keys['ArrowRight']) this.vx = 1;
    // Normalize diagonal
    if (this.vx !== 0 && this.vy !== 0) { this.vx *= 0.707; this.vy *= 0.707; }
    const slowMult = slowTimer > 0 ? 0.6 : 1;
    const spd = this.speed * this.buffs.speedMult * slowMult;
    this.x += this.vx * spd * dt;
    this.y += this.vy * spd * dt;
    // Clamp to current room
    this.x = Math.max(roomBounds.x + this.radius, Math.min(roomBounds.x + roomBounds.w - this.radius, this.x));
    this.y = Math.max(roomBounds.y + this.radius, Math.min(roomBounds.y + roomBounds.h - this.radius, this.y));
    // Skill: knight charge dash
    if (this.skillDash) {
      this.x += Math.cos(this.skillDash.angle) * this.skillDash.speed * dt;
      this.y += Math.sin(this.skillDash.angle) * this.skillDash.speed * dt;
      this.skillDash.timer -= dt;
      if (this.skillDash.timer <= 0) { this.skillDash = null; }
    }
    // Skill: assassin stealth -> burst on expire
    if (this.skillStealth) {
      this.skillStealth.timer -= dt;
      if (this.skillStealth.timer <= 0 && this.skillStealth.damageReady) {
        this.skillStealth.damageReady = false;
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const edx = enemy.x - this.x, edy = enemy.y - this.y;
          if (Math.sqrt(edx*edx + edy*edy) < 70) {
            enemy.takeDamage(10);
            spawnParticles(enemy.x, enemy.y, '#ff6644', 4);
          }
        }
        // Also damage boss if nearby
        if (boss && boss.alive) {
          const bdx = boss.x - this.x, bdy = boss.y - this.y;
          if (Math.sqrt(bdx*bdx + bdy*bdy) < 70) {
            boss.takeDamage(10);
            spawnParticles(boss.x, boss.y, '#ff6644', 6);
          }
        }
        spawnParticles(this.x, this.y, '#ff6644', 10);
      }
      if (this.skillStealth.timer <= -1.0) { this.skillStealth = null; }
    }
    // Aiming — angle toward mouse world position
    this.angle = Math.atan2(mouse.worldY - this.y, mouse.worldX - this.x);
    // Skill cooldown
    this.skillTimer = Math.max(0, this.skillTimer - dt);
    // Invincibility
    this.invincible = Math.max(0, this.invincible - dt);
    // Firing
    const wp = this.getWeapon();
    if (wp && mouse.down && (gameState === STATE.PLAYING || gameState === STATE.BOSS)) {
      const wData = WEAPONS[wp.type];
      const frMult = this.fireRateMult || 1;
      // Charged weapon (bow) — build charge while holding
      if (wData.type === 'charged') {
        this.chargeTimer = (this.chargeTimer || 0) + dt;
        const maxCharge = 1.2;
        if (this.chargeTimer >= maxCharge) {
          this.chargeTimer = 0;
          this.fireTimer = wData.fireRate * frMult;
          const b = spawnBullet(this.x, this.y, this.angle, wp.type, wp.affix);
          if (b) b.forEach(bul => { bul.damage *= 2.0; bul.pierce += 2; }); // charged: 2x damage, +2 pierce
          muzzleFlashes.push({x: this.x + Math.cos(this.angle)*18, y: this.y + Math.sin(this.angle)*18, life: 0.08, color: WEAPONS[wp.type].color});
          SFX.shoot();
        }
      } else {
        this.fireTimer -= dt;
        if (this.fireTimer <= 0) {
          this.fireTimer = wData.fireRate * frMult;
          spawnBullet(this.x, this.y, this.angle, wp.type, wp.affix);
          muzzleFlashes.push({x: this.x + Math.cos(this.angle)*18, y: this.y + Math.sin(this.angle)*18, life: 0.08, color: WEAPONS[wp.type].color});
          SFX.shoot();
          if (wData.burstDelay) {
            this.burstIndex = 1;
            this.burstTimer = wData.burstDelay;
          }
        }
        if (this.burstIndex > 0 && this.burstIndex < (wData.burstCount || 0)) {
          this.burstTimer -= dt;
          if (this.burstTimer <= 0) {
            spawnBullet(this.x, this.y, this.angle, wp.type, wp.affix);
            muzzleFlashes.push({x: this.x + Math.cos(this.angle)*18, y: this.y + Math.sin(this.angle)*18, life: 0.08, color: WEAPONS[wp.type].color});
            SFX.shoot();
            this.burstIndex++;
            this.burstTimer = wData.burstDelay;
          }
        }
      }
    } else {
      this.chargeTimer = 0; // reset charge on release
    }
    // Camera follow
    camera.targetX = this.x;
    camera.targetY = this.y;
    // Door collision check
    checkDoorCollision();
  },

  takeDamage(amount) {
    if (this.invincible > 0) return false;
    this.hp -= amount;
    SFX.damage();
    spawnParticles(this.x, this.y, '#ff4444', 5);
    this.invincible = 1.2;
    camera.shake(6);
    return this.hp <= 0;
  },

  activateSkill() {
    if (this.skillTimer > 0) return;
    this.skillTimer = this.skillCooldown;
    SFX.skill();
    switch (this.charClass) {
      case 'knight':
        // Charge slash: dash forward and deal melee damage in arc
        this.skillDash = { angle: this.angle, timer: 0.25, speed: 600 };
        // Damage enemies in a frontal cone
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const dx = enemy.x - this.x, dy = enemy.y - this.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 60) {
            const hitAngle = Math.atan2(dy, dx);
            let angleDiff = hitAngle - this.angle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
            if (Math.abs(angleDiff) < Math.PI/2.5) {
              enemy.takeDamage(6);
              spawnParticles(enemy.x, enemy.y, '#44aaff', 3);
            }
          }
        }
        spawnParticles(this.x, this.y, '#44aaff', 10);
        break;
      case 'mage':
        // Frost Nova: freeze all enemies in radius, damage them
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const dx2 = enemy.x - this.x, dy2 = enemy.y - this.y;
          if (Math.sqrt(dx2*dx2 + dy2*dy2) < 120) {
            enemy.state.frozen = true;
            enemy.state.frozenTimer = 2.5;
            enemy.takeDamage(4);
            spawnParticles(enemy.x, enemy.y, '#88ccff', 3);
          }
        }
        spawnParticles(this.x, this.y, '#cc44ff', 15);
        flashScreen(0.15);
        break;
      case 'assassin':
        // Shadow Step: become invisible/invincible briefly, then deal burst damage
        this.invincible = 1.5;
        this.skillStealth = { timer: 0.5, damageReady: true };
        spawnParticles(this.x, this.y, '#ff6644', 12);
        break;
      case 'archer':
        // Arrow Rain: fire 8 arrows in a spread toward mouse
        for (let i = -3; i <= 4; i++) {
          const arrowAngle = this.angle + i * 0.12;
          spawnBullet(this.x, this.y, arrowAngle, 'bow', 'fire');
        }
        spawnParticles(this.x, this.y, '#44ff88', 8);
        break;
      case 'engineer':
        // Turret Deployment: place an auto-turret at player position
        turrets.push({
          x: this.x, y: this.y,
          timer: 7.0,
          fireTimer: 0, fireRate: 0.3,
          radius: 10, color: '#ffaa44'
        });
        spawnParticles(this.x, this.y, '#ffaa44', 12);
        showMessage('炮台已部署!', 2000);
        break;
    }
  },

  getWeapon() {
    return this.weapons[this.currentWeapon] || null;
  },

  render(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible * 20) % 2 === 0) return; // blink
    const cd = CHARACTERS[this.charClass];
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const shape = cd.bodyShape || 'square';
    // Draw body based on character shape
    ctx.fillStyle = cd.color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;

    if (shape === 'square') {
      // Knight — heavy armor box
      ctx.fillRect(-11, -10, 22, 20);
      ctx.strokeRect(-11, -10, 22, 20);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, -4, 6, 8);
    } else if (shape === 'diamond') {
      // Mage — flowing robe diamond
      ctx.beginPath();
      ctx.moveTo(0, -12); ctx.lineTo(11, 0); ctx.lineTo(0, 10); ctx.lineTo(-11, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
    } else if (shape === 'triangle') {
      // Assassin — sharp upward triangle
      ctx.beginPath();
      ctx.moveTo(0, -12); ctx.lineTo(10, 10); ctx.lineTo(-10, 10);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 6); ctx.stroke();
    }

    // Head
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, shape === 'triangle' ? -10 : -9, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = cd.color;
    ctx.stroke();

    // Weapon line ahead
    ctx.strokeStyle = '#ffdd00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(22, 0);
    ctx.stroke();

    // Skill aura glow when ready
    if (this.skillTimer <= 0) {
      ctx.strokeStyle = cd.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4 + Math.sin(Date.now()/300) * 0.3;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }
};

// === ENEMY FACTORY ===
function createEnemy(type, x, y) {
  const data = ENEMY_DATA[type];
  if (!data) return null;
  const floorIdx = Math.min((dungeon?.floorNum || 1) - 1, TUNING.enemyHpScale.length - 1);
  const hpScale = TUNING.enemyHpScale[Math.max(0, floorIdx)];
  const dmgScale = TUNING.enemyDmgScale[Math.max(0, floorIdx)];
  const scaledHp = Math.round(data.hp * hpScale);
  const scaledDmg = Math.round(data.damage * dmgScale);
  return {
    type, x, y, hp: scaledHp, maxHp: scaledHp,
    speed: data.speed, damage: scaledDmg, radius: data.radius,
    color: data.color, behavior: data.behavior,
    fireRate: data.fireRate || 1, fireTimer: Math.random(),
    score: data.score, coins: data.coins,
    angle: 0, state: {},
    alive: true,
    flashTimer: 0,

    update(dt) {
      // Frozen state (from mage skill)
      if (this.state.frozen) {
        this.state.frozenTimer -= dt;
        if (this.state.frozenTimer <= 0) { this.state.frozen = false; this.state.frozenTimer = 0; }
      }
      // Burning DoT (from fire affix)
      if (this.state.burning) {
        this.state.burning.timer -= dt;
        this.hp -= this.state.burning.dps * dt;
        if (this.state.burning.timer <= 0) this.state.burning = null;
        if (this.hp <= 0 && this.alive) {
          this.alive = false;
          player.coins += this.coins;
          if (player.buffs.lifesteal > 0) player.hp = Math.min(player.maxHp, player.hp + 0.5);
          // Lightning chain on death
          if (this.state.lightningMark) {
            const chainTargets = enemies
              .filter(e => e.alive && e !== this)
              .sort((a, b) => {
                const da = (a.x-this.x)*(a.x-this.x) + (a.y-this.y)*(a.y-this.y);
                const db = (b.x-this.x)*(b.x-this.x) + (b.y-this.y)*(b.y-this.y);
                return da - db;
              })
              .slice(0, 2);
            for (const ct of chainTargets) {
              ct.takeDamage(10);
              spawnParticles(ct.x, ct.y, '#ffdd00', 5);
            }
          }
          spawnParticles(this.x, this.y, this.color, 8);
          SFX.enemyDeath();
        }
      }
      // Slowed state (from ice affix)
      if (this.state.slowed) {
        this.state.slowed.timer -= dt;
        if (this.state.slowed.timer <= 0) this.state.slowed = null;
      }
      this.fireTimer -= dt;
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      let slowMult = 1;
      if (this.state.frozen) slowMult = 0.15;
      else if (this.state.slowed) slowMult = 1 - this.state.slowed.factor;
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      this.angle = Math.atan2(dy, dx);

      const origSpeed = this.speed;
      if (this.state.frozen) this.speed *= 0.15;
      else if (this.state.slowed) this.speed *= (1 - this.state.slowed.factor);

      switch (this.behavior) {
        case 'chase':
          if (dist < 300) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          break;
        case 'shoot_straight':
          if (dist < 400 && dist > 60) { this.x += Math.cos(this.angle) * this.speed * 0.5 * dt; this.y += Math.sin(this.angle) * this.speed * 0.5 * dt; }
          if (dist < 350 && this.fireTimer <= 0 && !this.state.frozen) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 250, this.damage); }
          break;
        case 'circle_dive':
          this.state.orbitAngle = (this.state.orbitAngle || 0) + 2 * dt;
          const orbitR = 80;
          if (dist < 250) {
            this.x = player.x + Math.cos(this.state.orbitAngle) * orbitR;
            this.y = player.y + Math.sin(this.state.orbitAngle) * orbitR;
          } else { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 100) { this.state.dive = true; }
          if (this.state.dive) { this.x += Math.cos(this.angle) * this.speed * 3 * dt; this.y += Math.sin(this.angle) * this.speed * 3 * dt; this.state.diveTimer = (this.state.diveTimer || 0) + dt; if (this.state.diveTimer > 1.5) { this.state.dive = false; this.state.diveTimer = 0; } }
          break;
        case 'shield_front':
          if (dist < 250 && dist > 50) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          this.state.facing = this.angle;
          break;
        case 'shoot_burst':
          if (dist > 80) {
            const strafeAngle = this.angle + Math.PI/2;
            this.x += Math.cos(strafeAngle) * this.speed * dt * (Math.sin(Date.now()/1000) > 0 ? 1 : -1);
          }
          if (dist < 400 && this.fireTimer <= 0 && !this.state.frozen) { this.fireTimer = this.fireRate; for (let i = -1; i <= 1; i++) { spawnEnemyBullet(this.x, this.y, this.angle + i*0.1, 300, this.damage); } }
          break;
        case 'summon_track':
          if (dist < 300 && dist > 100) { this.x -= Math.cos(this.angle) * this.speed * dt; this.y -= Math.sin(this.angle) * this.speed * dt; }
          if (this.fireTimer <= 0 && !this.state.frozen) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 180, this.damage, true); }
          break;
        case 'kamikaze':
          if (dist < 250) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 20) { this.explode(); }
          break;
        case 'dash':
          if (dist < 300) {
            if (!this.state.dashing) { this.state.dashAngle = this.angle; this.state.dashTimer = 0; this.state.dashing = true; }
            this.state.dashTimer += dt;
            const dashSpd = 400 * slowMult;
            this.x += Math.cos(this.state.dashAngle) * dashSpd * dt;
            this.y += Math.sin(this.state.dashAngle) * dashSpd * dt;
            if (this.state.dashTimer > 1.0) { this.state.dashing = false; this.state.dashTimer = 0; }
          }
          break;
        case 'spin_laser':
          if (dist > 150) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (this.fireTimer <= 0 && !this.state.frozen) { this.fireTimer = this.fireRate; this.state.laserAngle = (this.state.laserAngle || 0) + Math.PI/6; for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) { spawnEnemyBullet(this.x, this.y, a + this.state.laserAngle, 200, this.damage); } }
          break;
        case 'throw_rock':
          if (dist > 150) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 500 && this.fireTimer <= 0 && !this.state.frozen) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 200, this.damage, false, true); }
          break;
      }
      this.speed = origSpeed;
    },

    takeDamage(amount) {
      this.hp -= amount;
      this.flashTimer = 0.1;
      if (this.hp <= 0) { this.alive = false; player.coins += this.coins;
        floatingTexts.push({x: this.x, y: this.y, text: '+' + this.coins + '💰', life: 1.0, color: '#ffdd00', vy: -60});
        if (player.buffs.lifesteal > 0) { player.hp = Math.min(player.maxHp, player.hp + 1); }
        // Lightning chain on death
        if (this.state.lightningMark) {
          const chainTargets = enemies
            .filter(e => e.alive && e !== this)
            .sort((a, b) => {
              const da = (a.x-this.x)*(a.x-this.x) + (a.y-this.y)*(a.y-this.y);
              const db = (b.x-this.x)*(b.x-this.x) + (b.y-this.y)*(b.y-this.y);
              return da - db;
            })
            .slice(0, 2);
          for (const ct of chainTargets) {
            ct.takeDamage(10);
            spawnParticles(ct.x, ct.y, '#ffdd00', 5);
          }
        }
        spawnParticles(this.x, this.y, this.color, 8); SFX.enemyDeath(); }
    },

    explode() {
      const dx = player.x - this.x, dy = player.y - this.y;
      if (Math.sqrt(dx*dx+dy*dy) < 50) player.takeDamage(this.damage);
      this.hp = 0; this.alive = false;
    },

    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      const col = this.flashTimer > 0 ? '#ffffff' : this.color;
      ctx.fillStyle = col;
      ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, -this.radius+4, 3, 3);
      ctx.fillRect(2, -this.radius+4, 3, 3);
      // Shield render for shield enemies
      if (this.behavior === 'shield_front') {
        ctx.strokeStyle = '#aaaacc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius+6, this.state.facing - Math.PI/3, this.state.facing + Math.PI/3);
        ctx.stroke();
      }
      // HP bar
      if (this.hp < this.maxHp) {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-10, -this.radius-8, 20, 3);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(-10, -this.radius-8, 20*(this.hp/this.maxHp), 3);
      }
      // Frozen visual (skill freeze or room entry protection)
      if (this.state.frozen || this.frozen) {
        ctx.strokeStyle = '#88ccff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(136,204,255,0.3)';
        ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
      }
      ctx.restore();
    }
  };
}

function spawnEnemyBullet(x, y, angle, speed, damage, tracking, parabolic) {
  enemyBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, damage, tracking, parabolic, life: 4 });
}

function spawnBossBullet(x, y, angle, speed, damage, color, parabolic, tracking) {
  bossBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, damage, color, parabolic, tracking, life: 5, baseSpeed: speed });
}

// === WEAPON SWITCH ===
function switchWeapon(slot) {
  if (slot >= 0 && slot < player.weapons.length) {
    player.currentWeapon = slot;
    player.fireTimer = 0;
  }
}

// === BOSS SYSTEM ===
function startBossFight(bossType) {
  const data = BOSS_DATA[bossType];
  if (!data) return;
  // Dramatic boss intro
  const room = getCurrentRoom();
  flashScreen(0.3);
  camera.shake(12);
  spawnParticles(room.cx, room.cy, '#ff0000', 40);
  floatingTexts.push({x: room.cx, y: room.cy - 40, text: data.name + ' 出现!', life: 2.5, color: data.color, vy: -30});
  const floorIdx = Math.min((dungeon?.floorNum || 1) - 1, TUNING.bossHpScale.length - 1);
  const hpScale = TUNING.bossHpScale[Math.max(0, floorIdx)];
  const scaledBossHp = Math.round(data.hp * hpScale);
  boss = {
    type: bossType, name: data.name,
    x: getCurrentRoom().cx, y: getCurrentRoom().cy - 60,
    hp: scaledBossHp, maxHp: scaledBossHp,
    radius: data.radius, color: data.color,
    speed: data.phases[0].moveSpeed,
    phase: 0, phases: data.phases,
    attackTimer: 0, attackCooldown: 1.5,
    currentAttack: null, attackState: {},
    angle: 0, alive: true,
    flashTimer: 0,

    update(dt) {
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      this.attackTimer -= dt;
      // Phase check
      const hpRatio = this.hp / this.maxHp;
      for (let i = this.phases.length - 1; i >= 0; i--) {
        if (hpRatio <= this.phases[i].threshold && i >= this.phase) {
          this.phase = i;
          this.speed = this.phases[i].moveSpeed;
        }
      }
      // Move toward player (unless stationary boss like vine_behemoth)
      if (this.speed > 0) {
        const dx = player.x - this.x, dy = player.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        this.angle = Math.atan2(dy, dx);
        if (dist > 100) {
          this.x += Math.cos(this.angle) * this.speed * dt;
          this.y += Math.sin(this.angle) * this.speed * dt;
        }
      }
      // Pick and execute attack
      if (this.attackTimer <= 0) { this.pickAttack(); }
      this.executeAttack(dt);
    },

    pickAttack() {
      const attacks = this.phases[this.phase].attacks;
      this.currentAttack = attacks[randInt(0, attacks.length - 1)];
      this.attackTimer = 2 + Math.random() * 2;
      this.attackState = { elapsed: 0 };
    },

    executeAttack(dt) {
      this.attackState.elapsed += dt;
      const t = this.attackState.elapsed;
      const a = this.currentAttack;
      // === Shared attack patterns ===
      if (a === 'bullet_hell' && t < 2) {
        if (Math.floor(t * 10) % 2 === 0) {
          for (let i = 0; i < 16; i++) {
            const ang = (i / 16) * Math.PI * 2 + t;
            spawnBossBullet(this.x, this.y, ang, 200, 1, '#ff4444');
          }
        }
      }
      if (a === 'charge' && t < 2) {
        this.x += Math.cos(this.angle) * 300 * dt;
        this.y += Math.sin(this.angle) * 300 * dt;
      }
      if (a === 'bomb' && t < 3) {
        if (Math.floor(t * 2) % 2 === 0) {
          for (let i = 0; i < 5; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.4 - 1, 150, 1, '#ff8800');
          }
        }
      }
      if (a === 'fire_cone' && t < 2) {
        if (Math.floor(t * 10) % 2 === 0) {
          for (let i = -3; i <= 3; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.15, 220 + t * 40, 1, '#ff4400');
          }
        }
      }
      if (a === 'tail_swipe' && t > 0.3 && t < 0.8) {
        const dx = player.x - this.x, dy = player.y - this.y;
        if (Math.sqrt(dx*dx + dy*dy) < 60) player.takeDamage(2);
      }
      if (a === 'dive') {
        if (t < 0.8) { this.y -= 300 * dt; }
        else if (t < 1.5) {
          this.y += 600 * dt;
          if (t > 1.2 && Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 80)
            player.takeDamage(2);
        }
      }
      if (a === 'summon' && t > 0.5 && !this.attackState.summoned) {
        this.attackState.summoned = true;
        for (let i = 0; i < 4; i++) {
          enemies.push(createEnemy('slime',
            this.x + (Math.random() - 0.5) * 100,
            this.y + (Math.random() - 0.5) * 100));
        }
      }
      if (a === 'teleport' && t > 0.8 && !this.attackState.teleported) {
        this.attackState.teleported = true;
        this.x = player.x + (Math.random() - 0.5) * 200;
        this.y = player.y + (Math.random() - 0.5) * 200;
      }
      if (a === 'ground_pound' && t > 1 && t < 1.3) {
        camera.shake(8);
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 100)
          player.takeDamage(1);
      }
      if (a === 'spawn_spiders' && t > 0.6 && !this.attackState.spawned) {
        this.attackState.spawned = true;
        for (let i = 0; i < 6; i++) {
          enemies.push(createEnemy('bat',
            this.x + (Math.random() - 0.5) * 120,
            this.y + (Math.random() - 0.5) * 120));
        }
      }
      // === Shadow Lord attacks ===
      if (a === 'clone' && t > 0.5 && !this.attackState.cloned) {
        this.attackState.cloned = true;
        for (let i = 0; i < 3; i++) {
          bossClones.push({
            x: this.x + (Math.random() - 0.5) * 200,
            y: this.y + (Math.random() - 0.5) * 200,
            life: 5, color: this.color, alpha: 0.5, radius: this.radius * 0.8
          });
        }
      }
      if (a === 'cross_laser' && t < 3) {
        this.attackState.laserRot = (this.attackState.laserRot || 0) + 1.5 * dt;
        const a0 = this.attackState.laserRot;
        for (let i = 0; i < 4; i++) {
          const la = a0 + i * Math.PI / 2;
          const pdx = player.x - this.x, pdy = player.y - this.y;
          const proj = Math.abs(-Math.sin(la) * pdx + Math.cos(la) * pdy);
          if (proj < 15 && Math.sqrt(pdx*pdx + pdy*pdy) < 400)
            player.takeDamage(1);
        }
      }
      if (a === 'fire_aura') {
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 70)
          player.takeDamage(0.5);
      }
      // === Spider Queen attacks ===
      if (a === 'web' && t > 0.3 && !this.attackState.webDone) {
        this.attackState.webDone = true;
        spawnBossBullet(this.x, this.y, this.angle, 300, 0, '#cccccc');
      }
      // === Vine Behemoth attacks ===
      if (a === 'tentacle' && t < 2) {
        const tentIdx = Math.floor(t * 6);
        if (tentIdx % 3 === 0 && !this.attackState['tent' + tentIdx]) {
          this.attackState['tent' + tentIdx] = true;
          const tx = this.x + (Math.random() - 0.5) * 250;
          const ty = this.y + (Math.random() - 0.5) * 200;
          tentacleZones.push({ x: tx, y: ty, timer: 1.0, radius: 20 });
          if (Math.sqrt((player.x - tx)**2 + (player.y - ty)**2) < 30)
            player.takeDamage(1);
        }
      }
      if (a === 'spore_cloud' && t < 3) {
        if (Math.floor(t * 3) !== this.attackState.lastSpore) {
          this.attackState.lastSpore = Math.floor(t * 3);
          sporeZones.push({
            x: player.x + (Math.random() - 0.5) * 80,
            y: player.y + (Math.random() - 0.5) * 80,
            life: 4, radius: 35
          });
        }
      }
      if (a === 'thorn_ring' && t < 2) {
        const ringR = 80 + t * 120;
        const thornCount = 24;
        for (let i = 0; i < thornCount; i++) {
          const ta = (i / thornCount) * Math.PI * 2 + t;
          const tx = this.x + Math.cos(ta) * ringR;
          const ty = this.y + Math.sin(ta) * ringR;
          if (Math.sqrt((player.x - tx)**2 + (player.y - ty)**2) < 16)
            player.takeDamage(1);
        }
      }
      // === Thousand Eye attacks ===
      if (a === 'spin_lasers' && t < 3) {
        this.attackState.spinAngle = (this.attackState.spinAngle || 0) + 3 * dt;
        for (let i = 0; i < 8; i++) {
          const la = this.attackState.spinAngle + i * Math.PI / 4;
          if (Math.floor(t * 10) % 2 === 0)
            spawnBossBullet(this.x, this.y, la, 180, 1, '#ff4488');
        }
      }
      if (a === 'flash_blind' && t > 0.5 && !this.attackState.blinded) {
        this.attackState.blinded = true;
        flashScreen(0.4);
      }
      if (a === 'eye_minions' && t > 0.3 && !this.attackState.minionsSpawned) {
        this.attackState.minionsSpawned = true;
        for (let i = 0; i < 6; i++) {
          enemies.push(createEnemy('bat',
            this.x + (Math.random() - 0.5) * 120,
            this.y + (Math.random() - 0.5) * 120));
        }
      }
      // === Thunder Lord attacks ===
      if (a === 'flash_strike' && t > 0.4 && !this.attackState.struck) {
        this.attackState.struck = true;
        this.x = player.x;
        this.y = player.y;
        camera.shake(10);
        // Check old position to avoid always hitting (boss is now at player pos)
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 50)
          player.takeDamage(2);
      }
      if (a === 'lightning_pillar' && t < 3) {
        if (Math.floor(t * 4) !== this.attackState.lastPillar) {
          this.attackState.lastPillar = Math.floor(t * 4);
          const px = player.x + (Math.random() - 0.5) * 150;
          const py = player.y + (Math.random() - 0.5) * 150;
          lightningPillars.push({ x: px, y: py, life: 2.0, radius: 25 });
        }
      }
      if (a === 'dash_combo' && t < 3) {
        if (Math.floor(t * 2) !== this.attackState.lastDash) {
          this.attackState.lastDash = Math.floor(t * 2);
          this.attackState.dashAngle = this.angle;
          this.attackState.dashTimer = 0;
        }
        this.x += Math.cos(this.attackState.dashAngle || this.angle) * 450 * dt;
        this.y += Math.sin(this.attackState.dashAngle || this.angle) * 450 * dt;
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 30)
          player.takeDamage(2);
      }
      // === Ancient Golem attacks ===
      if (a === 'rock_throw' && t < 3) {
        if (Math.floor(t * 3) % 2 === 0)
          spawnBossBullet(this.x, this.y, this.angle, 300, 2, '#888888', true);
      }
      if (a === 'rock_throw_fast' && t < 2) {
        if (Math.floor(t * 5) % 2 === 0)
          spawnBossBullet(this.x, this.y, this.angle, 350, 2, '#888888', true);
      }
      if (a === 'ground_slam' && t > 0.8 && t < 1.5) {
        for (let i = 0; i < 5; i++) {
          const sw = this.x + (i - 2) * 60;
          if (Math.abs(player.y - this.y) < 30 && Math.abs(player.x - sw) < 30)
            player.takeDamage(2);
        }
        camera.shake(6);
      }
      if (a === 'stone_wall' && t > 0.5 && !this.attackState.wallSpawned) {
        this.attackState.wallSpawned = true;
        for (let i = -1; i <= 1; i += 2) {
          stoneWalls.push({
            x: player.x + i * 80, y: player.y,
            life: 4, w: 20, h: 80
          });
        }
      }
      // === Shadow Twins attacks ===
      if (a === 'twin_slash') {
        if (t < 0.3) {
          // Wind-up — dash toward player
          this.x += Math.cos(this.angle) * 500 * dt;
          this.y += Math.sin(this.angle) * 500 * dt;
        } else if (t < 0.6) {
          // Slash arc
          if (!this.attackState.slashed) {
            this.attackState.slashed = true;
            if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 50)
              player.takeDamage(2);
          }
        }
      }
      if (a === 'twin_bolts' && t < 2) {
        if (Math.floor(t * 4) % 2 === 0) {
          for (let i = -1; i <= 1; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.15, 250, 1, '#9966cc');
          }
        }
      }
      if (a === 'twin_bolts_enraged' && t < 2) {
        if (Math.floor(t * 5) % 2 === 0) {
          for (let i = -2; i <= 2; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.2, 300, 1, '#bb44ff');
          }
        }
      }
      // === Magma Dragon phase 2: fire_tracking ===
      if (a === 'fire_tracking' && t < 2) {
        if (Math.floor(t * 4) !== this.attackState.lastTrack) {
          this.attackState.lastTrack = Math.floor(t * 4);
          const ta = Math.atan2(player.y - this.y, player.x - this.x);
          spawnBossBullet(this.x, this.y, ta, 200, 1, '#ff8800', false, true);
        }
      }
    },

    takeDamage(amount) {
      this.hp -= amount;
      this.flashTimer = 0.08;
      if (this.hp <= 0) { this.alive = false; spawnParticles(this.x, this.y, this.color, 30); }
    },

    render(ctx) {
      const col = this.flashTimer > 0 ? '#ffffff' : this.color;
      // Boss body
      ctx.fillStyle = col;
      ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
      // Boss eyes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 6, this.y - this.radius + 6, 5, 5);
      ctx.fillRect(this.x + 3, this.y - this.radius + 6, 5, 5);
      // Glow aura
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.15;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Cross laser rendering (shadow_lord)
      if (this.currentAttack === 'cross_laser' && this.attackState.laserRot != null) {
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = '#ff0044';
        ctx.lineWidth = 3;
        const a0 = this.attackState.laserRot;
        for (let i = 0; i < 4; i++) {
          const la = a0 + i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x + Math.cos(la) * 400, this.y + Math.sin(la) * 400);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  };
  bossBullets = [];
  bossClones = [];
  tentacleZones = [];
  sporeZones = [];
  lightningPillars = [];
  stoneWalls = [];
  gameState = STATE.BOSS;
}

function onBossDefeated() {
  const room = getCurrentRoom();
  const defeatedBossType = boss.type;
  const isFinalBoss = (defeatedBossType === 'shadow_lord');

  // Clean up boss state
  boss = null;
  bossBullets = [];
  bossClones = [];
  tentacleZones = [];
  sporeZones = [];
  lightningPillars = [];
  stoneWalls = [];

  SFX.bossExplosion();

  // If more bosses in queue, start next one consecutively
  if (bossQueue.length > 0) {
    showMessage('下一个 Boss 即将出现!', 2000);
    startBossFight(bossQueue.shift());
    return;
  }

  // All bosses on this floor defeated — give rewards
  room.cleared = true;

  // Drop buff based on floor (non-final bosses only)
  if (!isFinalBoss) {
    const floorIdx = dungeon.floorNum - 1;
    const floorBuffs = BOSS_BUFFS[floorIdx] || [];
    if (floorBuffs.length > 0) {
      const buff = floorBuffs[randInt(0, floorBuffs.length - 1)];
      buff.apply();
      showMessage('获得 Buff: ' + buff.name, 3000);
    }
  }
  // Drop weapon
  if (room) spawnRandomWeapon(room.cx, room.cy);
  // Drop health
  if (room) spawnDrop(room.cx - 30, room.cy, 'heart');

  if (isFinalBoss) {
    gameState = STATE.VICTORY;
    saveHighScore();
  } else {
    advanceFloor();
  }
}

// === MAP GENERATION FUNCTIONS ===
function getRoom(id) { return dungeon?.rooms[id]; }
function getCurrentRoom() { return getRoom(currentRoomIdx); }

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function createRoom(id, gx, gy, type) {
  return {
    id,
    gridX: gx, gridY: gy,
    cx: gx * (ROOM_W + CORRIDOR_W) + ROOM_W/2 + TILE,
    cy: gy * (ROOM_H + CORRIDOR_W) + ROOM_H/2 + TILE,
    x: gx * (ROOM_W + CORRIDOR_W) + TILE,
    y: gy * (ROOM_H + CORRIDOR_W) + TILE,
    w: ROOM_W, h: ROOM_H,
    type, explored: false, cleared: false,
    enemies: [],
    doors: [] // {x, y, targetRoomId, direction}
  };
}

function buildCorridors(rooms) {
  const corridors = [];
  const roomMap = {};
  for (const r of rooms) roomMap[`${r.gridX},${r.gridY}`] = r;

  for (const r of rooms) {
    const dirs = [{dx:1,dy:0,dir:'right'},{dx:-1,dy:0,dir:'left'},{dx:0,dy:1,dir:'down'},{dx:0,dy:-1,dir:'up'}];
    for (const {dx, dy, dir} of dirs) {
      const nx = r.gridX + dx, ny = r.gridY + dy;
      const neighbor = roomMap[`${nx},${ny}`];
      if (neighbor && neighbor.id > r.id) { // dedupe
        corridors.push({ from: r.id, to: neighbor.id });
        // Door from current room's perspective — at walkable boundary (16px inset from walls)
        let doorX, doorY;
        if (dir === 'right')      { doorX = r.x + r.w - 16; doorY = r.cy; }
        else if (dir === 'left')  { doorX = r.x + 16; doorY = r.cy; }
        else if (dir === 'down')  { doorX = r.cx; doorY = r.y + r.h - 16; }
        else                      { doorX = r.cx; doorY = r.y + 16; }
        r.doors.push({ x: doorX, y: doorY, targetRoomId: neighbor.id, dir });
        // Door from neighbor's perspective — computed from neighbor's walls (16px inset)
        const oppDir = {right:'left',left:'right',up:'down',down:'up'}[dir];
        let nDoorX, nDoorY;
        if (oppDir === 'right')      { nDoorX = neighbor.x + neighbor.w - 16; nDoorY = neighbor.cy; }
        else if (oppDir === 'left')  { nDoorX = neighbor.x + 16; nDoorY = neighbor.cy; }
        else if (oppDir === 'down')  { nDoorX = neighbor.cx; nDoorY = neighbor.y + neighbor.h - 16; }
        else                         { nDoorX = neighbor.cx; nDoorY = neighbor.y + 16; }
        neighbor.doors.push({ x: nDoorX, y: nDoorY, targetRoomId: r.id, dir: oppDir });
      }
    }
  }
  return corridors;
}

function generateFloor(floorNum) {
  const rooms = [];
  // Step 1: Place start room (leftmost column, random row)
  const startRow = randInt(0, GRID_ROWS - 1);
  const startRoom = createRoom(0, 0, startRow, ROOM_TYPE.START);
  startRoom.explored = true;
  startRoom.cleared = true;
  rooms.push(startRoom);

  // Step 2: BFS-style path generation across the grid — boss at rightmost column
  const bossRow = randInt(0, GRID_ROWS - 1);
  const bossRoom = createRoom(0, GRID_COLS - 1, bossRow, ROOM_TYPE.BOSS);

  // Step 3: Generate main path from start to boss (random walk)
  let path = [{x: 0, y: startRow}];
  let cx = 0, cy = startRow;
  while (cx < GRID_COLS - 1 || cy !== bossRow) {
    if (cx < GRID_COLS - 1 && (Math.random() < 0.7 || cy === bossRow)) {
      cx++;
    } else if (cy < bossRow) {
      cy++;
    } else if (cy > bossRow) {
      cy--;
    }
    path.push({x: cx, y: cy});
  }

  // Step 4: Add branch rooms
  const usedCells = new Set(path.map(p => `${p.x},${p.y}`));
  const branchCells = [];
  for (let gx = 0; gx < GRID_COLS; gx++) {
    for (let gy = 0; gy < GRID_ROWS; gy++) {
      if (!usedCells.has(`${gx},${gy}`) && Math.random() < 0.35) {
        branchCells.push({x: gx, y: gy});
        usedCells.add(`${gx},${gy}`);
      }
    }
  }

  // Step 5: Create all rooms
  let nextId = 1;
  // Main path rooms (skip start at index 0)
  const pathRooms = [];
  for (let i = 1; i < path.length; i++) {
    const p = path[i];
    const isBoss = (p.x === GRID_COLS - 1 && p.y === bossRow);
    const room = createRoom(nextId++, p.x, p.y, isBoss ? ROOM_TYPE.BOSS : ROOM_TYPE.COMBAT);
    if (isBoss) Object.assign(room, { x: bossRoom.x, y: bossRoom.y, cx: bossRoom.cx, cy: bossRoom.cy });
    pathRooms.push(room);
  }

  // Branch rooms
  const branchRooms = [];
  const branchTypes = [ROOM_TYPE.CHEST, ROOM_TYPE.SHOP, ROOM_TYPE.COMBAT, ROOM_TYPE.COMBAT];
  for (let i = 0; i < branchCells.length; i++) {
    const bc = branchCells[i];
    const rType = branchTypes[i % branchTypes.length];
    branchRooms.push(createRoom(nextId++, bc.x, bc.y, rType));
  }

  // Merge all rooms
  rooms.push(...pathRooms, ...branchRooms);
  // If boss wasn't in path (should be), add it
  if (!rooms.find(r => r.type === ROOM_TYPE.BOSS)) {
    bossRoom.id = nextId++;
    rooms.push(bossRoom);
  }

  // Step 6: Build connections (corridors) between adjacent rooms
  const corridors = buildCorridors(rooms);

  return { rooms, corridors, floorNum, startRoomId: 0 };
}

// === ROOM RENDERING ===
function renderRoom(ctx, room) {
  if (!room) return;
  if (!room.explored) return;

  const floorNum = dungeon?.floorNum || 1;
  // Floor themes per level
  const themes = {
    1: { floor: '#1a1e28', wall: '#2a3344', accent: '#3a4455', name: '地牢入口' },
    2: { floor: '#1a1a22', wall: '#332a2a', accent: '#553322', name: '地下洞穴' },
    3: { floor: '#0f0f1a', wall: '#2a2233', accent: '#442255', name: '深渊神殿' }
  };
  const theme = themes[Math.min(floorNum, 3)] || themes[1];

  // Floor with subtle gradient
  const grad = ctx.createLinearGradient(room.x, room.y, room.x, room.y + room.h);
  grad.addColorStop(0, theme.floor);
  grad.addColorStop(0.5, room.type === ROOM_TYPE.BOSS ? '#1a0808' : theme.floor);
  grad.addColorStop(1, theme.floor);
  ctx.fillStyle = grad;
  ctx.fillRect(room.x, room.y, room.w, room.h);

  // Floor tile pattern — staggered bricks
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let row = 0; row < Math.ceil(room.h / TILE); row++) {
    const offset = (row % 2) * (TILE / 2);
    for (let col = -1; col < Math.ceil(room.w / TILE) + 1; col++) {
      const tx = room.x + col * TILE + offset;
      const ty = room.y + row * TILE;
      ctx.strokeRect(tx, ty, TILE, TILE);
    }
  }

  // Random floor cracks/details
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 8; i++) {
    const cx = room.x + 30 + (room.w - 60) * ((i * 137 + 50) % 100) / 100;
    const cy = room.y + 30 + (room.h - 60) * ((i * 251 + 30) % 100) / 100;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + (i % 3 - 1) * 15, cy + (i % 2) * 10);
    ctx.stroke();
  }

  // Walls — thick layered brick border
  const wallColors = room.type === ROOM_TYPE.BOSS
    ? ['#ff333344', '#66111166', '#33000088']
    : [theme.wall, theme.accent, '#1a1a2288'];
  for (let layer = 2; layer >= 0; layer--) {
    const inset = layer * 3;
    ctx.strokeStyle = wallColors[layer];
    ctx.lineWidth = 5 - layer;
    ctx.strokeRect(room.x - inset, room.y - inset, room.w + inset*2, room.h + inset*2);
  }

  // Corner pillar decorations
  const corners = [
    {x: room.x - 2, y: room.y - 2},
    {x: room.x + room.w + 2, y: room.y - 2},
    {x: room.x - 2, y: room.y + room.h + 2},
    {x: room.x + room.w + 2, y: room.y + room.h + 2}
  ];
  for (const c of corners) {
    ctx.fillStyle = theme.accent;
    ctx.fillRect(c.x - 6, c.y - 6, 12, 12);
    ctx.strokeStyle = theme.wall;
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x - 6, c.y - 6, 12, 12);
  }

  // Doorways — arched gates with glow
  for (const door of room.doors) {
    // Door frame (larger, arched)
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.arc(door.x, door.y, 16, 0, Math.PI * 2);
    ctx.fill();
    // Glow ring
    const dirGrad = ctx.createRadialGradient(door.x, door.y, 12, door.x, door.y, 22);
    dirGrad.addColorStop(0, 'rgba(100,150,255,0)');
    dirGrad.addColorStop(0.5, 'rgba(100,150,255,0.08)');
    dirGrad.addColorStop(1, 'rgba(100,150,255,0)');
    ctx.fillStyle = dirGrad;
    ctx.beginPath();
    ctx.arc(door.x, door.y, 22, 0, Math.PI * 2);
    ctx.fill();
    // Frame border
    ctx.strokeStyle = '#667788';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(door.x, door.y, 16, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Room type indicator in center
  if (room.type === ROOM_TYPE.COMBAT && !room.cleared && enemies.filter(e => e.alive).length > 0) {
    // Subtle combat zone indicator — faint cross on floor
    ctx.strokeStyle = 'rgba(255,100,100,0.03)';
    ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(room.cx, room.y + 10); ctx.lineTo(room.cx, room.y + room.h - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(room.x + 10, room.cy); ctx.lineTo(room.x + room.w - 10, room.cy); ctx.stroke();
  }

  // Shopkeeper NPC in shop rooms
  if (room.type === ROOM_TYPE.SHOP) {
    const sx = room.cx, sy = room.cy + 40;
    ctx.save();
    ctx.translate(sx, sy);
    // Body
    ctx.fillStyle = '#8866cc';
    ctx.fillRect(-10, -12, 20, 24);
    // Head
    ctx.fillStyle = '#ccaa88';
    ctx.beginPath();
    ctx.arc(0, -8, 9, 0, Math.PI * 2);
    ctx.fill();
    // Pointed hat
    ctx.fillStyle = '#6644aa';
    ctx.fillRect(-7, -20, 14, 5);
    ctx.fillRect(-11, -14, 22, 3);
    ctx.restore();
    // Label
    ctx.fillStyle = '#ccaa88';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎩 商人', room.cx, room.cy + 75);
  }
  // Chest room visual
  if (room.type === ROOM_TYPE.CHEST && !room.cleared) {
    const chestPulse = 1 + Math.sin(Date.now() / 300) * 0.15;
    ctx.save();
    ctx.translate(room.cx, room.cy);
    ctx.font = (36 * chestPulse) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🧰', 0, 0);
    ctx.restore();
    ctx.fillStyle = '#aaccff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[E] 打开宝箱', room.cx, room.cy + 45);
  }
}

// === ROOM TRANSITIONS ===
function enterRoom(roomId) {
  currentRoomIdx = roomId;
  const room = getCurrentRoom();
  if (!room) return;
  room.explored = true;
  roomBounds = { x: room.x + 16, y: room.y + 16, w: room.w - 32, h: room.h - 32 };
  // Spawn player at center
  player.x = room.cx;
  player.y = room.cy;
  // Room entry protection: brief invincibility + enemy freeze
  roomEntryTimer = TUNING.roomEntryDelay;
  player.invincible = TUNING.roomEntryDelay;
  showMessage('进入房间 — ' + TUNING.roomEntryDelay + '秒保护!', TUNING.roomEntryDelay * 1000);
  // If combat room and not cleared, spawn enemies with delay
  if (room.type === ROOM_TYPE.COMBAT && !room.cleared) {
    spawnRoomEnemies(room);
  }
  // Boss room — start boss fight(s) per floor
  if (room.type === ROOM_TYPE.BOSS && !room.cleared) {
    bossQueue = [];
    if (dungeon.floorNum === 1) {
      const floor1Bosses = Object.keys(BOSS_DATA).filter(k => BOSS_DATA[k].floor === 1);
      bossQueue.push(floor1Bosses[randInt(0, floor1Bosses.length - 1)]);
    } else if (dungeon.floorNum === 2) {
      const floor2Bosses = Object.keys(BOSS_DATA).filter(k => BOSS_DATA[k].floor === 2);
      const shuffled = [...floor2Bosses].sort(() => Math.random() - 0.5);
      bossQueue.push(shuffled[0], shuffled[1]);
    } else {
      // Floor 3: 2 random + fixed shadow_lord
      const floor3Bosses = Object.keys(BOSS_DATA).filter(k => BOSS_DATA[k].floor === 3 && k !== 'shadow_lord');
      const shuffled = [...floor3Bosses].sort(() => Math.random() - 0.5);
      bossQueue.push(shuffled[0], shuffled[1], 'shadow_lord');
    }
    startBossFight(bossQueue.shift());
  }
}

function spawnRoomEnemies(room) {
  enemies = enemies.filter(e => e.alive);
  const count = 3 + Math.floor(Math.random() * 4) + dungeon.floorNum; // scaled back for fairness
  const validTypes = Object.keys(ENEMY_DATA).filter(t => ENEMY_DATA[t].floor <= dungeon.floorNum);
  for (let i = 0; i < count; i++) {
    const type = validTypes[randInt(0, validTypes.length - 1)];
    // Spawn away from player (min 180px distance)
    let ex, ey, tries = 0;
    do {
      ex = room.x + 60 + Math.random() * (room.w - 120);
      ey = room.y + 60 + Math.random() * (room.h - 120);
      tries++;
    } while (tries < 30 && Math.sqrt((ex-player.x)**2 + (ey-player.y)**2) < 180);
    const e = createEnemy(type, ex, ey);
    if (e) enemies.push(e);
  }
}

function checkDoorCollision() {
  const room = getCurrentRoom();
  if (!room) return;
  // Block door transitions if enemies or boss still alive
  const hasAliveEnemies = enemies.some(e => e.alive);
  const bossAlive = boss && boss.alive;
  if (hasAliveEnemies || bossAlive) return;
  for (const door of room.doors) {
    const dx = player.x - door.x;
    const dy = player.y - door.y;
    if (Math.sqrt(dx*dx + dy*dy) < 20) {
      SFX.doorOpen();
      enterRoom(door.targetRoomId);
      return;
    }
  }
}

// === COLLISION DETECTION ===
function checkBulletEnemyCollisions() {
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const dx = b.x - enemy.x, dy = b.y - enemy.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < enemy.radius + 4) {
        // Shield check
        if (enemy.behavior === 'shield_front') {
          const hitAngle = Math.atan2(dy, dx);
          let angleDiff = hitAngle - enemy.state.facing;
          while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
          if (Math.abs(angleDiff) < Math.PI/2.5) continue;
        }
        enemy.takeDamage(b.damage);
        // Apply affix effect on hit
        if (b.affix) {
          switch (b.affix) {
            case 'fire':
              enemy.state.burning = { timer: 3.0, dps: 3 };
              break;
            case 'ice':
              enemy.state.slowed = { timer: 2.0, factor: 0.4 };
              break;
            case 'poison':
              enemy.state.poisonStacks = (enemy.state.poisonStacks || 0) + 1;
              if (enemy.state.poisonStacks >= 3) {
                enemy.takeDamage(15);
                enemy.state.poisonStacks = 0;
                spawnParticles(enemy.x, enemy.y, '#44ff44', 6);
              }
              break;
            case 'explosive':
              for (const e2 of enemies) {
                if (e2 !== enemy && e2.alive) {
                  const dx2 = enemy.x - e2.x, dy2 = enemy.y - e2.y;
                  if (Math.sqrt(dx2*dx2+dy2*dy2) < 60) e2.takeDamage(b.damage * 0.5);
                }
              }
              spawnParticles(enemy.x, enemy.y, '#ff4400', 8);
              break;
            case 'knockback':
              const kdx = enemy.x - player.x, kdy = enemy.y - player.y;
              const kdist = Math.sqrt(kdx*kdx+kdy*kdy) || 1;
              enemy.x += (kdx/kdist) * 60;
              enemy.y += (kdy/kdist) * 60;
              break;
            case 'lightning':
              // Chain to nearest enemy within 150px on hit
              let nearest = null, nearestDist = 150;
              for (const e2 of enemies) {
                if (e2 === enemy || !e2.alive || e2.state.lightningHit) continue;
                const dx2 = enemy.x - e2.x, dy2 = enemy.y - e2.y;
                const d2 = Math.sqrt(dx2*dx2 + dy2*dy2);
                if (d2 < nearestDist) { nearestDist = d2; nearest = e2; }
              }
              if (nearest) {
                nearest.takeDamage(b.damage * 0.6);
                nearest.state.lightningHit = true;
                spawnParticles(nearest.x, nearest.y, '#ffdd00', 4);
                // Draw lightning line visual
                lightningBolts.push({x1: enemy.x, y1: enemy.y, x2: nearest.x, y2: nearest.y, life: 0.3});
              }
              enemy.state.lightningMark = true;
              break;
            case 'lifesteal':
              player.hp = Math.min(player.maxHp, player.hp + 1);
              break;
          }
        }
        SFX.hit();
        if (b.pierce <= 0) { bullets.splice(bi, 1); break; }
        else b.pierce--;
      }
    }
  }
}

function checkEnemyPlayerCollision(dt) {
  if (player.invincible > 0) return;
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    const dx = player.x - enemy.x, dy = player.y - enemy.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.radius + enemy.radius) {
      player.takeDamage(enemy.damage);
    }
  }
}

function checkEnemyBulletPlayerCollision() {
  if (player.invincible > 0) return;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    const dx = player.x - eb.x, dy = player.y - eb.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.radius + 5) {
      player.takeDamage(eb.damage);
      enemyBullets.splice(i, 1);
    }
  }
}

// === ENEMY BULLET UPDATE / RENDER ===
function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    if (eb.tracking) {
      const dx = player.x - eb.x, dy = player.y - eb.y;
      const tAngle = Math.atan2(dy, dx);
      const spd = Math.sqrt(eb.vx*eb.vx + eb.vy*eb.vy);
      eb.vx += Math.cos(tAngle) * spd * 2 * dt;
      eb.vy += Math.sin(tAngle) * spd * 2 * dt;
      const newSpd = Math.sqrt(eb.vx*eb.vx + eb.vy*eb.vy);
      const maxSpeed = 250;
      if (newSpd > maxSpeed) {
        eb.vx = (eb.vx / newSpd) * maxSpeed;
        eb.vy = (eb.vy / newSpd) * maxSpeed;
      }
    }
    if (eb.parabolic) {
      eb.vy += 300 * dt; // gravity
    }
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    eb.life -= dt;
  }
  enemyBullets = enemyBullets.filter(eb => eb.life > 0 &&
    eb.x > roomBounds.x - 100 && eb.x < roomBounds.x + roomBounds.w + 100 &&
    eb.y > roomBounds.y - 100 && eb.y < roomBounds.y + roomBounds.h + 100);
}

function renderEnemyBullets(ctx) {
  for (const eb of enemyBullets) {
    const color = eb.tracking ? '#ff4488' : (eb.parabolic ? '#888877' : '#ff6622');
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(eb.x, eb.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === LOOT DROP ===
function spawnDrop(x, y, type) {
  const item = { x, y, type, life: 30 };
  if (type === 'heart') { item.emoji = '❤️'; item.color = '#ff4444'; }
  else if (type === 'coin_pile') { item.emoji = '💰'; item.amount = randInt(TUNING.coinDropMin, TUNING.coinDropMax) * 3; item.color = '#ffdd00'; }
  else if (type === 'energy') { item.emoji = '⚡'; item.color = '#44aaff'; }
  else if (type === 'weapon') { /* filled by spawnRandomWeapon */ }
  drops.push(item);
}

function spawnRandomWeapon(x, y) {
  const wTypes = Object.keys(WEAPONS);
  const wType = wTypes[randInt(0, wTypes.length-1)];
  const hasAffix = Math.random() < 0.6;
  const affix = hasAffix ? Object.keys(AFFIXES)[randInt(0, Object.keys(AFFIXES).length-1)] : null;
  drops.push({
    x, y, type: 'weapon',
    weaponType: wType,
    affix,
    emoji: WEAPONS[wType].emoji,
    color: affix ? AFFIXES[affix].color : WEAPONS[wType].color,
    life: 30,
    name: `${affix ? AFFIXES[affix].name : ''}${WEAPONS[wType].name}`
  });
}

function pickupItem(item) {
  SFX.pickup();
  spawnParticles(item.x, item.y, item.color || '#ffffff', 5);
  switch (item.type) {
    case 'heart':
      player.hp = Math.min(player.maxHp, player.hp + 1);
      break;
    case 'coin_pile':
      player.coins += item.amount;
      break;
    case 'energy':
      player.skillTimer = Math.max(0, player.skillTimer - player.skillCooldown * 0.5);
      break;
    case 'weapon':
      if (player.weapons.length < 2) {
        player.weapons.push({ type: item.weaponType, affix: item.affix });
      } else {
        player.weapons[player.currentWeapon] = { type: item.weaponType, affix: item.affix };
      }
      const wInfo = WEAPONS[item.weaponType];
      const label = (item.affix ? '[' + AFFIXES[item.affix].name + ']' : '') + wInfo.name;
      showMessage('拾取武器: ' + label, 3000);
      break;
  }
}

function openShop() {
  gameState = STATE.SHOP;
  shopItems = [
    { type:'heart', name:'血包', price:TUNING.shopHeartPrice, emoji:'❤️' },
    { type:'weapon', name:'普通武器', price:TUNING.shopWeaponPrice, weaponType:Object.keys(WEAPONS)[randInt(0,7)], affix:null, emoji:'🔫' },
    { type:'weapon', name:'附魔武器', price:TUNING.shopEnchantedPrice, weaponType:Object.keys(WEAPONS)[randInt(0,7)], affix:Object.keys(AFFIXES)[randInt(0,6)], emoji:'✨' },
    { type:'energy', name:'技能重置', price:TUNING.shopEnergyPrice, emoji:'⚡' }
  ];
}

function buyShopItem(index) {
  const item = shopItems[index];
  if (!item) return;
  if (player.coins < item.price) return;
  player.coins -= item.price;
  switch (item.type) {
    case 'heart':
      player.hp = Math.min(player.maxHp, player.hp + 1);
      break;
    case 'weapon':
      if (player.weapons.length < 2) {
        player.weapons.push({ type: item.weaponType, affix: item.affix });
      } else {
        player.weapons[player.currentWeapon] = { type: item.weaponType, affix: item.affix };
      }
      break;
    case 'energy':
      player.skillTimer = 0;
      break;
  }
  showMessage('购买: ' + item.name, 2000);
  shopItems.splice(index, 1);
}

// === HELPER: UI message queue ===
function showMessage(text, duration) {
  messageQueue.push({ text, timer: duration / 1000 });
}

// === HELPER: Screen flash overlay ===
function flashScreen(duration) {
  flashAlpha = Math.max(flashAlpha, duration);
}

// === HELPER: Save high score ===
function getScore() {
  return player.coins * 10 + (player.maxHp * 50) + (dungeon ? dungeon.floorNum * 200 : 0);
}
function saveHighScore() {
  try {
    const score = getScore();
    const scores = JSON.parse(localStorage.getItem('pixelKnightScores') || '[]');
    scores.push({ score, date: new Date().toISOString() });
    scores.sort((a, b) => b.score - a.score);
    localStorage.setItem('pixelKnightScores', JSON.stringify(scores.slice(0, 10)));
    // Also update simple high score for renderMenu
    const currentHigh = parseInt(localStorage.getItem('pixel_knight_highscore') || '0');
    if (score > currentHigh) {
      localStorage.setItem('pixel_knight_highscore', score.toString());
    }
  } catch(e) {}
}

// === PARTICLE SYSTEM ===
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.5,
      maxLife: 0.3 + Math.random() * 0.5,
      color, radius: 1 + Math.random() * 3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function renderParticles(ctx) {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius*2, p.radius*2);
  }
  ctx.globalAlpha = 1;
}

// === FLOOR PROGRESSION ===
function advanceFloor() {
  if (dungeon.floorNum >= 3) {
    // Should not normally happen (floor 3 boss is shadow_lord → victory),
    // but if a non-shadow-lord boss was beaten on floor 3, regenerate floor 3
    enemies = [];
    bullets = [];
    enemyBullets = [];
    dungeon = generateFloor(3);
    currentRoomIdx = dungeon.startRoomId;
    enterRoom(currentRoomIdx);
    player.hp = player.maxHp;
    return;
  }
  // Screen flash white
  flashScreen(0.5);
  // Clear old enemies and bullets from previous floor
  enemies = [];
  bullets = [];
  enemyBullets = [];
  // Generate next floor
  dungeon = generateFloor(dungeon.floorNum + 1);
  currentRoomIdx = dungeon.startRoomId;
  enterRoom(currentRoomIdx);
  // Full heal
  player.hp = player.maxHp;
  // Keep buffs, weapons, coins
}

// === AUDIO: Web Audio API Sound Effects ===
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

const SFX = {
  play(freq, duration, type, volume, ramp) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume || 0.1, ctx.currentTime);
      if (ramp) gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      else gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* audio not supported */ }
  },

  shoot() { this.play(800, 0.05, 'square', 0.05); },
  hit() { this.play(200, 0.08, 'sawtooth', 0.08, true); },
  enemyDeath() { this.play(150, 0.15, 'triangle', 0.06, true); },
  bossExplosion() {
    this.play(60, 0.5, 'sawtooth', 0.15, true);
    setTimeout(() => this.play(40, 0.4, 'square', 0.1, true), 200);
  },
  pickup() { this.play(600, 0.06, 'sine', 0.08); setTimeout(() => this.play(900, 0.06, 'sine', 0.08), 60); },
  menuSelect() { this.play(440, 0.1, 'sine', 0.1); setTimeout(() => this.play(660, 0.1, 'sine', 0.1), 80); },
  skill() { this.play(300, 0.2, 'triangle', 0.12); setTimeout(() => this.play(500, 0.15, 'triangle', 0.1), 100); },
  doorOpen() { this.play(250, 0.12, 'sine', 0.06); },
  damage() { this.play(100, 0.1, 'sawtooth', 0.12, true); }
};

// === BULLET UPDATE / RENDER ===
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < roomBounds.x - 50 || b.x > roomBounds.x + roomBounds.w + 50 ||
        b.y < roomBounds.y - 50 || b.y > roomBounds.y + roomBounds.h + 50) {
      bullets.splice(i, 1);
    }
  }
}

function renderBullets(ctx) {
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.isMelee ? 0 : 3, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.fillStyle = b.color.replace('ff','aa');
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === BOSS BULLETS UPDATE / RENDER ===
function updateBossBullets(dt) {
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    const bb = bossBullets[i];
    if (bb.parabolic) { bb.vy += 300 * dt; }
    if (bb.tracking) {
      const dx = player.x - bb.x, dy = player.y - bb.y;
      const tAngle = Math.atan2(dy, dx);
      const lerpFactor = 3 * dt;
      bb.vx += Math.cos(tAngle) * (bb.baseSpeed || 200) * lerpFactor;
      bb.vy += Math.sin(tAngle) * (bb.baseSpeed || 200) * lerpFactor;
      const spd = Math.sqrt(bb.vx*bb.vx + bb.vy*bb.vy);
      const maxSpd = (bb.baseSpeed || 200) * 1.5;
      if (spd > maxSpd) { bb.vx = (bb.vx / spd) * maxSpd; bb.vy = (bb.vy / spd) * maxSpd; }
    }
    bb.x += bb.vx * dt;
    bb.y += bb.vy * dt;
    bb.life -= dt;
    // Check stone wall collision for boss bullets
    let hitWall = false;
    for (const sw of stoneWalls) {
      if (bb.x > sw.x - sw.w/2 && bb.x < sw.x + sw.w/2 &&
          bb.y > sw.y - sw.h/2 && bb.y < sw.y + sw.h/2) {
        hitWall = true; break;
      }
    }
    if (bb.life <= 0 || hitWall ||
        bb.x < roomBounds.x - 100 || bb.x > roomBounds.x + roomBounds.w + 100 ||
        bb.y < roomBounds.y - 100 || bb.y > roomBounds.y + roomBounds.h + 100) {
      bossBullets.splice(i, 1);
    }
  }
}

function renderBossBullets(ctx) {
  for (const bb of bossBullets) {
    ctx.fillStyle = bb.color || '#ff4444';
    ctx.beginPath();
    ctx.arc(bb.x, bb.y, 4, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    if (bb.color) {
      ctx.fillStyle = bb.color.replace('ff', '66');
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// === BOSS CLONES UPDATE / RENDER (shadow_lord) ===
function updateBossClones(dt) {
  for (const clone of bossClones) {
    clone.life -= dt * 0.5;
  }
  bossClones = bossClones.filter(c => c.life > 0);
}

function renderBossClones(ctx) {
  for (const clone of bossClones) {
    ctx.save();
    ctx.globalAlpha = clone.alpha;
    ctx.fillStyle = clone.color;
    ctx.fillRect(clone.x - clone.radius, clone.y - clone.radius, clone.radius * 2, clone.radius * 2);
    ctx.restore();
  }
}

// === TENTACLE ZONES UPDATE / RENDER (vine_behemoth) ===
function updateTentacleZones(dt) {
  for (let i = tentacleZones.length - 1; i >= 0; i--) {
    const tz = tentacleZones[i];
    tz.timer -= dt;
    if (tz.timer <= 0) { tentacleZones.splice(i, 1); continue; }
    // Check player collision
    const dx = player.x - tz.x, dy = player.y - tz.y;
    if (Math.sqrt(dx*dx + dy*dy) < tz.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderTentacleZones(ctx) {
  for (const tz of tentacleZones) {
    ctx.save();
    ctx.globalAlpha = tz.timer;
    ctx.fillStyle = '#44aa44';
    ctx.beginPath();
    ctx.arc(tz.x, tz.y, tz.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#88cc88';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// === SPORE ZONES UPDATE / RENDER (vine_behemoth) ===
function updateSporeZones(dt) {
  for (let i = sporeZones.length - 1; i >= 0; i--) {
    const sz = sporeZones[i];
    sz.life -= dt;
    if (sz.life <= 0) { sporeZones.splice(i, 1); continue; }
    const dx = player.x - sz.x, dy = player.y - sz.y;
    if (Math.sqrt(dx*dx + dy*dy) < sz.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderSporeZones(ctx) {
  for (const sz of sporeZones) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#66cc66';
    ctx.beginPath();
    ctx.arc(sz.x, sz.y, sz.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// === LIGHTNING PILLARS UPDATE / RENDER (thunder_lord) ===
function updateLightningPillars(dt) {
  for (let i = lightningPillars.length - 1; i >= 0; i--) {
    const lp = lightningPillars[i];
    lp.life -= dt;
    if (lp.life <= 0) { lightningPillars.splice(i, 1); continue; }
    const dx = player.x - lp.x, dy = player.y - lp.y;
    if (Math.sqrt(dx*dx + dy*dy) < lp.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderLightningPillars(ctx) {
  for (const lp of lightningPillars) {
    ctx.save();
    ctx.globalAlpha = lp.life / 2.0;
    ctx.strokeStyle = '#ffdd00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y - 60);
    ctx.lineTo(lp.x, lp.y + 40);
    ctx.stroke();
    // Branches
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y - 20);
    ctx.lineTo(lp.x - 12, lp.y);
    ctx.moveTo(lp.x, lp.y);
    ctx.lineTo(lp.x + 10, lp.y + 15);
    ctx.stroke();
    ctx.restore();
  }
}

// === STONE WALLS UPDATE / RENDER (ancient_golem) ===
function updateStoneWalls(dt) {
  for (let i = stoneWalls.length - 1; i >= 0; i--) {
    const sw = stoneWalls[i];
    sw.life -= dt * 0.5;
    if (sw.life <= 0) { stoneWalls.splice(i, 1); continue; }
    // Block player bullets hitting walls
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (b.x > sw.x - sw.w/2 && b.x < sw.x + sw.w/2 &&
          b.y > sw.y - sw.h/2 && b.y < sw.y + sw.h/2) {
        bullets.splice(bi, 1);
      }
    }
  }
}

function renderStoneWalls(ctx) {
  for (const sw of stoneWalls) {
    ctx.save();
    ctx.globalAlpha = sw.life / 4;
    ctx.fillStyle = '#666655';
    ctx.fillRect(sw.x - sw.w/2, sw.y - sw.h/2, sw.w, sw.h);
    ctx.strokeStyle = '#888877';
    ctx.lineWidth = 3;
    ctx.strokeRect(sw.x - sw.w/2, sw.y - sw.h/2, sw.w, sw.h);
    ctx.restore();
  }
}

// === BOSS COLLISION ===
function checkBulletBossCollision() {
  if (!boss || !boss.alive) return;
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    const dx = b.x - boss.x, dy = b.y - boss.y;
    if (Math.sqrt(dx*dx + dy*dy) < boss.radius + 6) {
      boss.takeDamage(b.damage);
      bullets.splice(bi, 1);
    }
  }
}

function checkBossBulletPlayerCollision() {
  if (player.invincible > 0) return;
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    const bb = bossBullets[i];
    const dx = player.x - bb.x, dy = player.y - bb.y;
    if (Math.sqrt(dx*dx + dy*dy) < player.radius + 5) {
      // Web bullet applies slow
      if (bb.color === '#cccccc') { slowTimer = 2.0; }
      player.takeDamage(bb.damage);
      bossBullets.splice(i, 1);
    }
  }
}

function checkBossPlayerCollision() {
  if (!boss || !boss.alive) return;
  if (player.invincible > 0) return;
  const dx = player.x - boss.x, dy = player.y - boss.y;
  if (Math.sqrt(dx*dx + dy*dy) < player.radius + boss.radius) {
    player.takeDamage(1);
  }
}

function checkBossClonesPlayerCollision() {
  for (let i = bossClones.length - 1; i >= 0; i--) {
    const c = bossClones[i];
    const dx = player.x - c.x, dy = player.y - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < player.radius + c.radius) {
      player.takeDamage(1);
    }
  }
}

// === GAME LOOP ===
let lastTime = 0;
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  if (lastTime === 0) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.016;
  lastTime = timestamp;
  update(dt);
  render();
}
// Main update/render — player + camera driving the game loop
function update(dt) {
  // === MENU NAVIGATION KEYS ===
  // Tab: toggle minimap expanded (during gameplay)
  if (keys['Tab']) {
    keys['Tab'] = false;
    if (gameState === STATE.PLAYING || gameState === STATE.BOSS || gameState === STATE.SHOP) {
      minimapExpanded = !minimapExpanded;
    }
  }
  // Esc: pause/resume or close shop
  if (keys['Escape']) {
    keys['Escape'] = false;
    if (gameState === STATE.PLAYING || gameState === STATE.BOSS) {
      prePauseState = gameState;
      gameState = STATE.PAUSED;
    } else if (gameState === STATE.PAUSED) {
      gameState = prePauseState || STATE.PLAYING;
    } else if (gameState === STATE.SHOP) {
      gameState = STATE.PLAYING;
    }
  }
  // Enter: return to menu from gameover/victory
  if (keys['Enter']) {
    keys['Enter'] = false;
    if (gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) {
      gameState = STATE.MENU;
    }
  }

  // UI overlay updates
  flashAlpha = Math.max(0, flashAlpha - dt);
  slowTimer = Math.max(0, slowTimer - dt);

  // Update message queue
  for (let i = messageQueue.length - 1; i >= 0; i--) {
    messageQueue[i].timer -= dt;
    if (messageQueue[i].timer <= 0) messageQueue.splice(i, 1);
  }

  // Update drops lifetime
  for (let i = drops.length - 1; i >= 0; i--) {
    drops[i].life -= dt;
    if (drops[i].life <= 0) drops.splice(i, 1);
  }

  // Weapon switch keys (only when playing)
  if (gameState === STATE.PLAYING || gameState === STATE.BOSS) {
    if (keys['Digit1']) { keys['Digit1'] = false; switchWeapon(0); }
    if (keys['Digit2']) { keys['Digit2'] = false; switchWeapon(1); }
    if (keys['Space']) { keys['Space'] = false; player.activateSkill(); }
  }

  // === Shop buying keys (when in shop state) ===
  if (gameState === STATE.SHOP) {
    if (keys['Digit1']) { keys['Digit1'] = false; buyShopItem(0); }
    if (keys['Digit2']) { keys['Digit2'] = false; buyShopItem(1); }
    if (keys['Digit3']) { keys['Digit3'] = false; buyShopItem(2); }
    if (keys['Digit4']) { keys['Digit4'] = false; buyShopItem(3); }
  }

  // === E key: pickup drops / interact with shop / close shop ===
  if (keys['KeyE']) {
    keys['KeyE'] = false;
    if (gameState === STATE.PLAYING) {
      // Pickup nearby drops
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        const dx = player.x - d.x, dy = player.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < 40) {
          pickupItem(d);
          drops.splice(i, 1);
        }
      }
      // Chest room interaction
      const room = getCurrentRoom();
      if (room && room.type === ROOM_TYPE.CHEST && !room.cleared) {
        const cdx = player.x - room.cx, cdy = player.y - room.cy;
        if (Math.sqrt(cdx*cdx + cdy*cdy) < 60) {
          SFX.pickup();
          showMessage('打开宝箱!', 2000);
          if (Math.random() < TUNING.dropChanceWeapon) {
            spawnRandomWeapon(room.cx, room.cy - 20);
          }
          if (Math.random() < TUNING.dropChanceHeart) {
            spawnDrop(room.cx + 30, room.cy, 'heart');
          }
          spawnDrop(room.cx - 30, room.cy, 'coin_pile');
          room.cleared = true;
        }
      }
      // Shop interaction
      if (room && room.type === ROOM_TYPE.SHOP && !room.cleared) {
        const sx = room.cx, sy = room.cy + 40;
        const sdx = player.x - sx, sdy = player.y - sy;
        if (Math.sqrt(sdx*sdx + sdy*sdy) < 60) {
          openShop();
        }
      }
    } else if (gameState === STATE.SHOP) {
      gameState = STATE.PLAYING;
    }
  }

  // Escape to close shop (handled above in key block, but keep as safety)

  // === GAME SIMULATION (only during active gameplay) ===
  if (gameState === STATE.PLAYING || gameState === STATE.BOSS || gameState === STATE.SHOP) {
  player.update(dt);
  updateBullets(dt);

  // Boss update
  if (boss && gameState === STATE.BOSS) {
    if (boss.alive) {
      boss.update(dt);
      updateBossBullets(dt);
      updateBossClones(dt);
      updateTentacleZones(dt);
      updateSporeZones(dt);
      updateLightningPillars(dt);
      updateStoneWalls(dt);
      checkBulletBossCollision();
      checkBossBulletPlayerCollision();
      checkBossPlayerCollision();
      checkBossClonesPlayerCollision();
    }
    // Check boss defeat (outside alive check so it fires the frame after HP reaches 0)
