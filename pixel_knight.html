// Boss buff drops per floor
const BOSS_BUFFS = [

   { name:'移速+15%', apply:()=>{ player.buffs.speedMult+=0.15; }}],

   { name:'击杀回血', apply:()=>{ player.buffs.lifesteal=(player.buffs.lifesteal||0)+1; }}],
  [{ name:'伤害+20%', apply:()=>{ player.buffs.damageMult+=0.20; }},
   { name:'生命上限+1', apply:()=>{ player.maxHp+=1; player.hp+=1; }},
   { name:'弹幕穿透+1', apply:()=>{ player.buffs.pierce+=1; }}]
];

// === BULLETS ===
let bullets = [];
let enemies = [];
let enemyBullets = [];

// === BOSS GLOBALS ===
let boss = null;
let bossBullets = [];
let bossClones = [];        // shadow_lord clones
let tentacleZones = [];    // vine_behemoth tentacles
let sporeZones = [];       // vine_behemoth spores
let lightningPillars = []; // thunder_lord pillars
let stoneWalls = [];       // ancient_golem walls

// === DROPS & SHOP ===
let drops = [];
let shopItems = [];

// === UI OVERLAY STATE ===
let messageQueue = [];
let flashAlpha = 0;
let slowTimer = 0;

function spawnBullet(x, y, angle, wType, affixKey) {
  const wData = WEAPONS[wType];
  const count = wData.count || 1;
  for (let i = 0; i < count; i++) {
    const spreadAngle = angle + (Math.random() - 0.5) * wData.spread * 2;
    bullets.push({
      x, y,
      vx: Math.cos(spreadAngle) * wData.speed,
      vy: Math.sin(spreadAngle) * wData.speed,
      weapon: wType, affix: affixKey,
      damage: wData.damage * player.buffs.damageMult,
      pierce: wData.pierce + player.buffs.pierce,
      color: affixKey ? AFFIXES[affixKey].color : wData.color,
      life: 3,
      bounce: wData.bounces || 0,
      isMelee: wType === 'sword',
      arc: wData.arc || 0,
      isBeam: wType === 'laser',
      poisonStacks: {}
    });
  }
}

// === CANVAS SETUP ===
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = GW;
canvas.height = GH;

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / GW, window.innerHeight / GH);
  canvas.style.width = (GW * scale) + 'px';
  canvas.style.height = (GH * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// === INPUT ===
const keys = {};
const mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0 };
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GW / rect.width;
  const scaleY = GH / rect.height;
  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
  const wp = camera.screenToWorld(mouse.x, mouse.y);
  mouse.worldX = wp.x; mouse.worldY = wp.y;
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// === CAMERA ===
const camera = {
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  shakeAmount: 0, shakeDecay: 4,
  update(dt) {
    // Smooth follow
    this.x += (this.targetX - this.x) * 8 * dt;
    this.y += (this.targetY - this.y) * 8 * dt;
    this.shakeAmount = Math.max(0, this.shakeAmount - this.shakeDecay * dt);
  },
  shake(amount) { this.shakeAmount = Math.max(this.shakeAmount, amount); },
  applyTransform(ctx) {
    ctx.save();
    let sx = this.shakeAmount * (Math.random() * 2 - 1);
    let sy = this.shakeAmount * (Math.random() * 2 - 1);
    ctx.translate(GW/2 - this.x + sx, GH/2 - this.y + sy);
  },
  restore(ctx) { ctx.restore(); },
  worldToScreen(wx, wy) {
    return {
      x: GW/2 + (wx - this.x),
      y: GH/2 + (wy - this.y)
    };
  },
  screenToWorld(sx, sy) {
    return {
      x: this.x + (sx - GW/2),
      y: this.y + (sy - GH/2)
    };
  }
};

const CHARACTERS = {
  knight: {
    name: '骑士', emoji: '⚔️', color: '#44aaff',
    hp: 5, speed: 200, skillName: '冲锋斩', skillCD: 10,

  },
  assassin: {

    description: '隐身突袭，爆发伤害×3'
  }
};

// === PLAYER ===
const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  radius: 14, angle: 0,
  charClass: 'knight',
  speed: 200,
  hp: 5, maxHp: 5,
  skillTimer: 0, skillCooldown: 10,
  weapons: [], currentWeapon: 0,
  coins: 0,
  buffs: { damageMult: 1, speedMult: 1, pierce: 0, hpBonus: 0 },
  invincible: 0,

  init(chosenClass) {
    const data = CHARACTERS[chosenClass];
    this.charClass = chosenClass;
    this.speed = data.speed;
    this.maxHp = data.hp;
    this.hp = data.hp;
    this.skillCooldown = data.skillCD;
    this.skillTimer = 0;
    this.coins = 0;
    this.buffs = { damageMult: 1, speedMult: 1, pierce: 0, hpBonus: 0 };
    this.invincible = 0;
    this.weapons = [{ type: 'pistol', affix: null }]; // start pistol
    this.currentWeapon = 0;
    this.fireTimer = 0;
    this.burstIndex = 0;
    this.burstTimer = 0;
  },

  update(dt) {
    // Movement
    this.vx = 0; this.vy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) this.vy = -1;
    if (keys['KeyS'] || keys['ArrowDown']) this.vy = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) this.vx = -1;
    if (keys['KeyD'] || keys['ArrowRight']) this.vx = 1;
    // Normalize diagonal
    if (this.vx !== 0 && this.vy !== 0) { this.vx *= 0.707; this.vy *= 0.707; }
    const slowMult = slowTimer > 0 ? 0.6 : 1;
    const spd = this.speed * this.buffs.speedMult * slowMult;
    this.x += this.vx * spd * dt;
    this.y += this.vy * spd * dt;
    // Clamp to current room
    this.x = Math.max(roomBounds.x + this.radius, Math.min(roomBounds.x + roomBounds.w - this.radius, this.x));
    this.y = Math.max(roomBounds.y + this.radius, Math.min(roomBounds.y + roomBounds.h - this.radius, this.y));
    // Aiming — angle toward mouse world position
    this.angle = Math.atan2(mouse.worldY - this.y, mouse.worldX - this.x);
    // Skill cooldown
    this.skillTimer = Math.max(0, this.skillTimer - dt);
    // Invincibility
    this.invincible = Math.max(0, this.invincible - dt);
    // Firing
    const wp = this.getWeapon();
    if (wp && mouse.down && (gameState === STATE.PLAYING || gameState === STATE.BOSS)) {
      const wData = WEAPONS[wp.type];
      const frMult = this.fireRateMult || 1;
      this.fireTimer -= dt;
      if (this.fireTimer <= 0) {
        this.fireTimer = wData.fireRate * frMult;
        spawnBullet(this.x, this.y, this.angle, wp.type, wp.affix);
        if (wData.burstDelay) {
          this.burstIndex = 1;
          this.burstTimer = wData.burstDelay;
        }
      }
      if (this.burstIndex > 0 && this.burstIndex < (wData.burstCount || 0)) {
        this.burstTimer -= dt;
        if (this.burstTimer <= 0) {
          spawnBullet(this.x, this.y, this.angle, wp.type, wp.affix);
          this.burstIndex++;
          this.burstTimer = wData.burstDelay;
        }
      }
    }
    // Camera follow
    camera.targetX = this.x;
    camera.targetY = this.y;
    // Door collision check
    checkDoorCollision();
  },

  takeDamage(amount) {
    if (this.invincible > 0) return false;
    this.hp -= amount;
    this.invincible = 0.5;
    camera.shake(6);
    return this.hp <= 0;
  },

  useSkill() {
    if (this.skillTimer > 0) return;
    this.skillTimer = this.skillCooldown;
    // Skill effects handled per-character in update
  },

  getWeapon() {
    return this.weapons[this.currentWeapon] || null;
  },

  render(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible * 20) % 2 === 0) return; // blink
    const cd = CHARACTERS[this.charClass];
    ctx.save();
    ctx.translate(this.x, this.y);
    // Body
    ctx.fillStyle = cd.color;
    ctx.fillRect(-10, -8, 20, 16);
    // Helmet/head
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -6, 8, 0, Math.PI * 2);
    ctx.fill();
    // Weapon line pointing toward mouse
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(6 + Math.cos(this.angle) * 16, Math.sin(this.angle) * 16);
    ctx.stroke();
    ctx.restore();
  }
};

// === ENEMY FACTORY ===
function createEnemy(type, x, y) {
  const data = ENEMY_DATA[type];
  if (!data) return null;
  return {
    type, x, y, hp: data.hp, maxHp: data.hp,
    speed: data.speed, damage: data.damage, radius: data.radius,
    color: data.color, behavior: data.behavior,
    fireRate: data.fireRate || 1, fireTimer: Math.random(),
    score: data.score, coins: data.coins,
    angle: 0, state: {},
    alive: true,
    flashTimer: 0,

    update(dt) {
      this.fireTimer -= dt;
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      this.angle = Math.atan2(dy, dx);

      switch (this.behavior) {
        case 'chase':
          if (dist < 300) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          break;
        case 'shoot_straight':
          if (dist < 400 && dist > 60) { this.x += Math.cos(this.angle) * this.speed * 0.5 * dt; this.y += Math.sin(this.angle) * this.speed * 0.5 * dt; }
          if (dist < 350 && this.fireTimer <= 0) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 250, this.damage); }
          break;
        case 'circle_dive':
          this.state.orbitAngle = (this.state.orbitAngle || 0) + 2 * dt;
          const orbitR = 80;
          if (dist < 250) {
            this.x = player.x + Math.cos(this.state.orbitAngle) * orbitR;
            this.y = player.y + Math.sin(this.state.orbitAngle) * orbitR;
          } else { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 100) { this.state.dive = true; }
          if (this.state.dive) { this.x += Math.cos(this.angle) * this.speed * 3 * dt; this.y += Math.sin(this.angle) * this.speed * 3 * dt; this.state.diveTimer = (this.state.diveTimer || 0) + dt; if (this.state.diveTimer > 1.5) { this.state.dive = false; this.state.diveTimer = 0; } }
          break;
        case 'shield_front':
          if (dist < 250 && dist > 50) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          this.state.facing = this.angle;
          break;
        case 'shoot_burst':
          if (dist > 80) {
            const strafeAngle = this.angle + Math.PI/2;
            this.x += Math.cos(strafeAngle) * this.speed * dt * (Math.sin(Date.now()/1000) > 0 ? 1 : -1);
          }
          if (dist < 400 && this.fireTimer <= 0) { this.fireTimer = this.fireRate; for (let i = -1; i <= 1; i++) { spawnEnemyBullet(this.x, this.y, this.angle + i*0.1, 300, this.damage); } }
          break;
        case 'summon_track':
          if (dist < 300 && dist > 100) { this.x -= Math.cos(this.angle) * this.speed * dt; this.y -= Math.sin(this.angle) * this.speed * dt; }
          if (this.fireTimer <= 0) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 180, this.damage, true); }
          break;
        case 'kamikaze':
          if (dist < 250) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 20) { this.explode(); }
          break;
        case 'dash':
          if (dist < 300) {
            if (!this.state.dashing) { this.state.dashAngle = this.angle; this.state.dashTimer = 0; this.state.dashing = true; }
            this.state.dashTimer += dt;
            const dashSpd = 400;
            this.x += Math.cos(this.state.dashAngle) * dashSpd * dt;
            this.y += Math.sin(this.state.dashAngle) * dashSpd * dt;
            if (this.state.dashTimer > 1.0) { this.state.dashing = false; this.state.dashTimer = 0; }
          }
          break;
        case 'spin_laser':
          if (dist > 150) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (this.fireTimer <= 0) { this.fireTimer = this.fireRate; this.state.laserAngle = (this.state.laserAngle || 0) + Math.PI/6; for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) { spawnEnemyBullet(this.x, this.y, a + this.state.laserAngle, 200, this.damage); } }
          break;
        case 'throw_rock':
          if (dist > 150) { this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt; }
          if (dist < 500 && this.fireTimer <= 0) { this.fireTimer = this.fireRate; spawnEnemyBullet(this.x, this.y, this.angle, 200, this.damage, false, true); }
          break;
      }
    },

    takeDamage(amount) {
      this.hp -= amount;
      this.flashTimer = 0.1;
      if (this.hp <= 0) { this.alive = false; player.coins += this.coins; if (player.buffs.lifesteal > 0) { player.hp = Math.min(player.maxHp, player.hp + 0.5); } }
    },

    explode() {
      const dx = player.x - this.x, dy = player.y - this.y;
      if (Math.sqrt(dx*dx+dy*dy) < 50) player.takeDamage(this.damage);
      this.hp = 0; this.alive = false;
    },

    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      const col = this.flashTimer > 0 ? '#ffffff' : this.color;
      ctx.fillStyle = col;
      ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, -this.radius+4, 3, 3);
      ctx.fillRect(2, -this.radius+4, 3, 3);
      // Shield render for shield enemies
      if (this.behavior === 'shield_front') {
        ctx.strokeStyle = '#aaaacc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius+6, this.state.facing - Math.PI/3, this.state.facing + Math.PI/3);
        ctx.stroke();
      }
      // HP bar
      if (this.hp < this.maxHp) {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-10, -this.radius-8, 20, 3);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(-10, -this.radius-8, 20*(this.hp/this.maxHp), 3);
      }
      ctx.restore();
    }
  };
}

function spawnEnemyBullet(x, y, angle, speed, damage, tracking, parabolic) {
  enemyBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, damage, tracking, parabolic, life: 4 });
}

function spawnBossBullet(x, y, angle, speed, damage, color, parabolic, tracking) {
  bossBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, damage, color, parabolic, tracking, life: 5, baseSpeed: speed });
}

// === WEAPON SWITCH ===
function switchWeapon(slot) {
  if (slot >= 0 && slot < player.weapons.length) {
    player.currentWeapon = slot;
    player.fireTimer = 0;
  }
}

// === BOSS SYSTEM ===
function startBossFight(bossType) {
  const data = BOSS_DATA[bossType];
  if (!data) return;
  boss = {
    type: bossType, name: data.name,
    x: getCurrentRoom().cx, y: getCurrentRoom().cy - 60,
    hp: data.hp, maxHp: data.hp,
    radius: data.radius, color: data.color,
    speed: data.phases[0].moveSpeed,
    phase: 0, phases: data.phases,
    attackTimer: 0, attackCooldown: 1.5,
    currentAttack: null, attackState: {},
    angle: 0, alive: true,
    flashTimer: 0,

    update(dt) {
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      this.attackTimer -= dt;
      // Phase check
      const hpRatio = this.hp / this.maxHp;
      for (let i = this.phases.length - 1; i >= 0; i--) {
        if (hpRatio <= this.phases[i].threshold && i >= this.phase) {
          this.phase = i;
          this.speed = this.phases[i].moveSpeed;
        }
      }
      // Move toward player (unless stationary boss like vine_behemoth)
      if (this.speed > 0) {
        const dx = player.x - this.x, dy = player.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        this.angle = Math.atan2(dy, dx);
        if (dist > 100) {
          this.x += Math.cos(this.angle) * this.speed * dt;
          this.y += Math.sin(this.angle) * this.speed * dt;
        }
      }
      // Pick and execute attack
      if (this.attackTimer <= 0) { this.pickAttack(); }
      this.executeAttack(dt);
    },

    pickAttack() {
      const attacks = this.phases[this.phase].attacks;
      this.currentAttack = attacks[randInt(0, attacks.length - 1)];
      this.attackTimer = 2 + Math.random() * 2;
      this.attackState = { elapsed: 0 };
    },

    executeAttack(dt) {
      this.attackState.elapsed += dt;
      const t = this.attackState.elapsed;
      const a = this.currentAttack;
      // === Shared attack patterns ===
      if (a === 'bullet_hell' && t < 2) {
        if (Math.floor(t * 10) % 2 === 0) {
          for (let i = 0; i < 16; i++) {
            const ang = (i / 16) * Math.PI * 2 + t;
            spawnBossBullet(this.x, this.y, ang, 200, 1, '#ff4444');
          }
        }
      }
      if (a === 'charge' && t < 2) {
        this.x += Math.cos(this.angle) * 300 * dt;
        this.y += Math.sin(this.angle) * 300 * dt;
      }
      if (a === 'bomb' && t < 3) {
        if (Math.floor(t * 2) % 2 === 0) {
          for (let i = 0; i < 5; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.4 - 1, 150, 1, '#ff8800');
          }
        }
      }
      if (a === 'fire_cone' && t < 2) {
        if (Math.floor(t * 10) % 2 === 0) {
          for (let i = -3; i <= 3; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.15, 220 + t * 40, 1, '#ff4400');
          }
        }
      }
      if (a === 'tail_swipe' && t > 0.3 && t < 0.8) {
        const dx = player.x - this.x, dy = player.y - this.y;
        if (Math.sqrt(dx*dx + dy*dy) < 60) player.takeDamage(2);
      }
      if (a === 'dive') {
        if (t < 0.8) { this.y -= 300 * dt; }
        else if (t < 1.5) {
          this.y += 600 * dt;
          if (t > 1.2 && Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 80)
            player.takeDamage(2);
        }
      }
      if (a === 'summon' && t > 0.5 && !this.attackState.summoned) {
        this.attackState.summoned = true;
        for (let i = 0; i < 4; i++) {
          enemies.push(createEnemy('slime',
            this.x + (Math.random() - 0.5) * 100,
            this.y + (Math.random() - 0.5) * 100));
        }
      }
      if (a === 'teleport' && t > 0.8 && !this.attackState.teleported) {
        this.attackState.teleported = true;
        this.x = player.x + (Math.random() - 0.5) * 200;
        this.y = player.y + (Math.random() - 0.5) * 200;
      }
      if (a === 'ground_pound' && t > 1 && t < 1.3) {
        camera.shake(8);
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 100)
          player.takeDamage(1);
      }
      if (a === 'spawn_spiders' && t > 0.6 && !this.attackState.spawned) {
        this.attackState.spawned = true;
        for (let i = 0; i < 6; i++) {
          enemies.push(createEnemy('bat',
            this.x + (Math.random() - 0.5) * 120,
            this.y + (Math.random() - 0.5) * 120));
        }
      }
      // === Shadow Lord attacks ===
      if (a === 'clone' && t > 0.5 && !this.attackState.cloned) {
        this.attackState.cloned = true;
        for (let i = 0; i < 3; i++) {
          bossClones.push({
            x: this.x + (Math.random() - 0.5) * 200,
            y: this.y + (Math.random() - 0.5) * 200,
            life: 5, color: this.color, alpha: 0.5, radius: this.radius * 0.8
          });
        }
      }
      if (a === 'cross_laser' && t < 3) {
        this.attackState.laserRot = (this.attackState.laserRot || 0) + 1.5 * dt;
        const a0 = this.attackState.laserRot;
        for (let i = 0; i < 4; i++) {
          const la = a0 + i * Math.PI / 2;
          const pdx = player.x - this.x, pdy = player.y - this.y;
          const proj = Math.abs(-Math.sin(la) * pdx + Math.cos(la) * pdy);
          if (proj < 15 && Math.sqrt(pdx*pdx + pdy*pdy) < 400)
            player.takeDamage(1);
        }
      }
      if (a === 'fire_aura') {
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 70)
          player.takeDamage(0.5);
      }
      // === Spider Queen attacks ===
      if (a === 'web' && t > 0.3 && !this.attackState.webDone) {
        this.attackState.webDone = true;
        spawnBossBullet(this.x, this.y, this.angle, 300, 0, '#cccccc');
      }
      // === Vine Behemoth attacks ===
      if (a === 'tentacle' && t < 2) {
        const tentIdx = Math.floor(t * 6);
        if (tentIdx % 3 === 0 && !this.attackState['tent' + tentIdx]) {
          this.attackState['tent' + tentIdx] = true;
          const tx = this.x + (Math.random() - 0.5) * 250;
          const ty = this.y + (Math.random() - 0.5) * 200;
          tentacleZones.push({ x: tx, y: ty, timer: 1.0, radius: 20 });
          if (Math.sqrt((player.x - tx)**2 + (player.y - ty)**2) < 30)
            player.takeDamage(1);
        }
      }
      if (a === 'spore_cloud' && t < 3) {
        if (Math.floor(t * 3) !== this.attackState.lastSpore) {
          this.attackState.lastSpore = Math.floor(t * 3);
          sporeZones.push({
            x: player.x + (Math.random() - 0.5) * 80,
            y: player.y + (Math.random() - 0.5) * 80,
            life: 4, radius: 35
          });
        }
      }
      if (a === 'thorn_ring' && t < 2) {
        const ringR = 80 + t * 120;
        const thornCount = 24;
        for (let i = 0; i < thornCount; i++) {
          const ta = (i / thornCount) * Math.PI * 2 + t;
          const tx = this.x + Math.cos(ta) * ringR;
          const ty = this.y + Math.sin(ta) * ringR;
          if (Math.sqrt((player.x - tx)**2 + (player.y - ty)**2) < 16)
            player.takeDamage(1);
        }
      }
      // === Thousand Eye attacks ===
      if (a === 'spin_lasers' && t < 3) {
        this.attackState.spinAngle = (this.attackState.spinAngle || 0) + 3 * dt;
        for (let i = 0; i < 8; i++) {
          const la = this.attackState.spinAngle + i * Math.PI / 4;
          if (Math.floor(t * 10) % 2 === 0)
            spawnBossBullet(this.x, this.y, la, 180, 1, '#ff4488');
        }
      }
      if (a === 'flash_blind' && t > 0.5 && !this.attackState.blinded) {
        this.attackState.blinded = true;
        flashScreen(0.4);
      }
      if (a === 'eye_minions' && t > 0.3 && !this.attackState.minionsSpawned) {
        this.attackState.minionsSpawned = true;
        for (let i = 0; i < 6; i++) {
          enemies.push(createEnemy('bat',
            this.x + (Math.random() - 0.5) * 120,
            this.y + (Math.random() - 0.5) * 120));
        }
      }
      // === Thunder Lord attacks ===
      if (a === 'flash_strike' && t > 0.4 && !this.attackState.struck) {
        this.attackState.struck = true;
        this.x = player.x;
        this.y = player.y;
        camera.shake(10);
        // Check old position to avoid always hitting (boss is now at player pos)
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 50)
          player.takeDamage(2);
      }
      if (a === 'lightning_pillar' && t < 3) {
        if (Math.floor(t * 4) !== this.attackState.lastPillar) {
          this.attackState.lastPillar = Math.floor(t * 4);
          const px = player.x + (Math.random() - 0.5) * 150;
          const py = player.y + (Math.random() - 0.5) * 150;
          lightningPillars.push({ x: px, y: py, life: 2.0, radius: 25 });
        }
      }
      if (a === 'dash_combo' && t < 3) {
        if (Math.floor(t * 2) !== this.attackState.lastDash) {
          this.attackState.lastDash = Math.floor(t * 2);
          this.attackState.dashAngle = this.angle;
          this.attackState.dashTimer = 0;
        }
        this.x += Math.cos(this.attackState.dashAngle || this.angle) * 450 * dt;
        this.y += Math.sin(this.attackState.dashAngle || this.angle) * 450 * dt;
        if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 30)
          player.takeDamage(2);
      }
      // === Ancient Golem attacks ===
      if (a === 'rock_throw' && t < 3) {
        if (Math.floor(t * 3) % 2 === 0)
          spawnBossBullet(this.x, this.y, this.angle, 300, 2, '#888888', true);
      }
      if (a === 'rock_throw_fast' && t < 2) {
        if (Math.floor(t * 5) % 2 === 0)
          spawnBossBullet(this.x, this.y, this.angle, 350, 2, '#888888', true);
      }
      if (a === 'ground_slam' && t > 0.8 && t < 1.5) {
        for (let i = 0; i < 5; i++) {
          const sw = this.x + (i - 2) * 60;
          if (Math.abs(player.y - this.y) < 30 && Math.abs(player.x - sw) < 30)
            player.takeDamage(2);
        }
        camera.shake(6);
      }
      if (a === 'stone_wall' && t > 0.5 && !this.attackState.wallSpawned) {
        this.attackState.wallSpawned = true;
        for (let i = -1; i <= 1; i += 2) {
          stoneWalls.push({
            x: player.x + i * 80, y: player.y,
            life: 4, w: 20, h: 80
          });
        }
      }
      // === Shadow Twins attacks ===
      if (a === 'twin_slash') {
        if (t < 0.3) {
          // Wind-up — dash toward player
          this.x += Math.cos(this.angle) * 500 * dt;
          this.y += Math.sin(this.angle) * 500 * dt;
        } else if (t < 0.6) {
          // Slash arc
          if (!this.attackState.slashed) {
            this.attackState.slashed = true;
            if (Math.sqrt((player.x - this.x)**2 + (player.y - this.y)**2) < 50)
              player.takeDamage(2);
          }
        }
      }
      if (a === 'twin_bolts' && t < 2) {
        if (Math.floor(t * 4) % 2 === 0) {
          for (let i = -1; i <= 1; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.15, 250, 1, '#9966cc');
          }
        }
      }
      if (a === 'twin_bolts_enraged' && t < 2) {
        if (Math.floor(t * 5) % 2 === 0) {
          for (let i = -2; i <= 2; i++) {
            spawnBossBullet(this.x, this.y, this.angle + i * 0.2, 300, 1, '#bb44ff');
          }
        }
      }
      // === Magma Dragon phase 2: fire_tracking ===
      if (a === 'fire_tracking' && t < 2) {
        if (Math.floor(t * 4) !== this.attackState.lastTrack) {
          this.attackState.lastTrack = Math.floor(t * 4);
          const ta = Math.atan2(player.y - this.y, player.x - this.x);
          spawnBossBullet(this.x, this.y, ta, 200, 1, '#ff8800', false, true);
        }
      }
    },

    takeDamage(amount) {
      this.hp -= amount;
      this.flashTimer = 0.08;
      if (this.hp <= 0) { this.alive = false; }
    },

    render(ctx) {
      const col = this.flashTimer > 0 ? '#ffffff' : this.color;
      // Boss body
      ctx.fillStyle = col;
      ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
      // Boss eyes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 6, this.y - this.radius + 6, 5, 5);
      ctx.fillRect(this.x + 3, this.y - this.radius + 6, 5, 5);
      // Glow aura
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.15;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Cross laser rendering (shadow_lord)
      if (this.currentAttack === 'cross_laser' && this.attackState.laserRot != null) {
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = '#ff0044';
        ctx.lineWidth = 3;
        const a0 = this.attackState.laserRot;
        for (let i = 0; i < 4; i++) {
          const la = a0 + i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x + Math.cos(la) * 400, this.y + Math.sin(la) * 400);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  };
  bossBullets = [];
  bossClones = [];
  tentacleZones = [];
  sporeZones = [];
  lightningPillars = [];
  stoneWalls = [];
  gameState = STATE.BOSS;
}

function onBossDefeated() {
  const room = getCurrentRoom();
  room.cleared = true;
  const defeatedBossType = boss.type;
  const isFinalBoss = (defeatedBossType === 'shadow_lord');

  // Drop buff based on floor (non-final bosses only)
  if (!isFinalBoss) {
    const floorIdx = dungeon.floorNum - 1;
    const floorBuffs = BOSS_BUFFS[floorIdx] || [];
    if (floorBuffs.length > 0) {
      const buff = floorBuffs[randInt(0, floorBuffs.length - 1)];
      buff.apply();
      showMessage('获得 Buff: ' + buff.name, 3000);
    }
  }
  // Drop weapon
  if (room) spawnRandomWeapon(room.cx, room.cy);
  // Drop health
  if (room) spawnDrop(room.cx - 30, room.cy, 'heart');

  // Clean up boss state
  boss = null;
  bossBullets = [];
  bossClones = [];
  tentacleZones = [];
  sporeZones = [];
  lightningPillars = [];
  stoneWalls = [];

  if (isFinalBoss) {
    gameState = STATE.VICTORY;
    saveHighScore();
    SFX.bossExplosion();
  } else {
    gameState = STATE.PLAYING;
  }
}

// === MAP GENERATION FUNCTIONS ===
function getRoom(id) { return dungeon?.rooms[id]; }
function getCurrentRoom() { return getRoom(currentRoomIdx); }

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function createRoom(id, gx, gy, type) {
  return {
    id,
    gridX: gx, gridY: gy,
    cx: gx * (ROOM_W + CORRIDOR_W) + ROOM_W/2 + TILE,
    cy: gy * (ROOM_H + CORRIDOR_W) + ROOM_H/2 + TILE,
    x: gx * (ROOM_W + CORRIDOR_W) + TILE,
    y: gy * (ROOM_H + CORRIDOR_W) + TILE,
    w: ROOM_W, h: ROOM_H,
    type, explored: false, cleared: false,
    enemies: [],
    doors: [] // {x, y, targetRoomId, direction}
  };
}

function buildCorridors(rooms) {
  const corridors = [];
  const roomMap = {};
  for (const r of rooms) roomMap[`${r.gridX},${r.gridY}`] = r;

  for (const r of rooms) {
    const dirs = [{dx:1,dy:0,dir:'right'},{dx:-1,dy:0,dir:'left'},{dx:0,dy:1,dir:'down'},{dx:0,dy:-1,dir:'up'}];
    for (const {dx, dy, dir} of dirs) {
      const nx = r.gridX + dx, ny = r.gridY + dy;
      const neighbor = roomMap[`${nx},${ny}`];
      if (neighbor && neighbor.id > r.id) { // dedupe
        corridors.push({ from: r.id, to: neighbor.id });
        // Door from current room's perspective — at walkable boundary (16px inset from walls)
        let doorX, doorY;
        if (dir === 'right')      { doorX = r.x + r.w - 16; doorY = r.cy; }
        else if (dir === 'left')  { doorX = r.x + 16; doorY = r.cy; }
        else if (dir === 'down')  { doorX = r.cx; doorY = r.y + r.h - 16; }
        else                      { doorX = r.cx; doorY = r.y + 16; }
        r.doors.push({ x: doorX, y: doorY, targetRoomId: neighbor.id, dir });
        // Door from neighbor's perspective — computed from neighbor's walls (16px inset)
        const oppDir = {right:'left',left:'right',up:'down',down:'up'}[dir];
        let nDoorX, nDoorY;
        if (oppDir === 'right')      { nDoorX = neighbor.x + neighbor.w - 16; nDoorY = neighbor.cy; }
        else if (oppDir === 'left')  { nDoorX = neighbor.x + 16; nDoorY = neighbor.cy; }
        else if (oppDir === 'down')  { nDoorX = neighbor.cx; nDoorY = neighbor.y + neighbor.h - 16; }
        else                         { nDoorX = neighbor.cx; nDoorY = neighbor.y + 16; }
        neighbor.doors.push({ x: nDoorX, y: nDoorY, targetRoomId: r.id, dir: oppDir });
      }
    }
  }
  return corridors;
}

function generateFloor(floorNum) {
  const rooms = [];
  // Step 1: Place start room (leftmost column, random row)
  const startRow = randInt(0, GRID_ROWS - 1);
  const startRoom = createRoom(0, 0, startRow, ROOM_TYPE.START);
  startRoom.explored = true;
  startRoom.cleared = true;
  rooms.push(startRoom);

  // Step 2: BFS-style path generation across the grid — boss at rightmost column
  const bossRow = randInt(0, GRID_ROWS - 1);
  const bossRoom = createRoom(0, GRID_COLS - 1, bossRow, ROOM_TYPE.BOSS);

  // Step 3: Generate main path from start to boss (random walk)
  let path = [{x: 0, y: startRow}];
  let cx = 0, cy = startRow;
  while (cx < GRID_COLS - 1 || cy !== bossRow) {
    if (cx < GRID_COLS - 1 && (Math.random() < 0.7 || cy === bossRow)) {
      cx++;
    } else if (cy < bossRow) {
      cy++;
    } else if (cy > bossRow) {
      cy--;
    }
    path.push({x: cx, y: cy});
  }

  // Step 4: Add branch rooms
  const usedCells = new Set(path.map(p => `${p.x},${p.y}`));
  const branchCells = [];
  for (let gx = 0; gx < GRID_COLS; gx++) {
    for (let gy = 0; gy < GRID_ROWS; gy++) {
      if (!usedCells.has(`${gx},${gy}`) && Math.random() < 0.35) {
        branchCells.push({x: gx, y: gy});
        usedCells.add(`${gx},${gy}`);
      }
    }
  }

  // Step 5: Create all rooms
  let nextId = 1;
  // Main path rooms (skip start at index 0)
  const pathRooms = [];
  for (let i = 1; i < path.length; i++) {
    const p = path[i];
    const isBoss = (p.x === GRID_COLS - 1 && p.y === bossRow);
    const room = createRoom(nextId++, p.x, p.y, isBoss ? ROOM_TYPE.BOSS : ROOM_TYPE.COMBAT);
    if (isBoss) Object.assign(room, { x: bossRoom.x, y: bossRoom.y, cx: bossRoom.cx, cy: bossRoom.cy });
    pathRooms.push(room);
  }

  // Branch rooms
  const branchRooms = [];
  const branchTypes = [ROOM_TYPE.CHEST, ROOM_TYPE.SHOP, ROOM_TYPE.COMBAT, ROOM_TYPE.COMBAT];
  for (let i = 0; i < branchCells.length; i++) {
    const bc = branchCells[i];
    const rType = branchTypes[i % branchTypes.length];
    branchRooms.push(createRoom(nextId++, bc.x, bc.y, rType));
  }

  // Merge all rooms
  rooms.push(...pathRooms, ...branchRooms);
  // If boss wasn't in path (should be), add it
  if (!rooms.find(r => r.type === ROOM_TYPE.BOSS)) {
    bossRoom.id = nextId++;
    rooms.push(bossRoom);
  }

  // Step 6: Build connections (corridors) between adjacent rooms
  const corridors = buildCorridors(rooms);

  return { rooms, corridors, floorNum, startRoomId: 0 };
}

// === ROOM RENDERING ===
function renderRoom(ctx, room) {
  if (!room) return;
  if (!room.explored) return;
  // Floor
  ctx.fillStyle = room.type === ROOM_TYPE.BOSS ? '#1a0a0a' : '#1a1a2e';
  ctx.fillRect(room.x, room.y, room.w, room.h);
  // Walls (thick borders)
  ctx.strokeStyle = room.type === ROOM_TYPE.BOSS ? '#ff333388' : '#334466';
  ctx.lineWidth = 4;
  ctx.strokeRect(room.x - 2, room.y - 2, room.w + 4, room.h + 4);
  // Floor pattern — grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let tx = room.x; tx < room.x + room.w; tx += TILE) {
    for (let ty = room.y; ty < room.y + room.h; ty += TILE) {
      ctx.strokeRect(tx, ty, TILE, TILE);
    }
  }
  // Doorways
  ctx.fillStyle = '#0a0a18';
  for (const door of room.doors) {
    ctx.fillRect(door.x - 14, door.y - 14, 28, 28);
    ctx.strokeStyle = '#556677';
    ctx.strokeRect(door.x - 14, door.y - 14, 28, 28);
  }
  // Shopkeeper NPC in shop rooms
  if (room.type === ROOM_TYPE.SHOP) {
    const sx = room.cx, sy = room.cy + 40;
    ctx.save();
    ctx.translate(sx, sy);
    // Body
    ctx.fillStyle = '#8866cc';
    ctx.fillRect(-10, -12, 20, 24);
    // Head
    ctx.fillStyle = '#ccaa88';
    ctx.beginPath();
    ctx.arc(0, -8, 9, 0, Math.PI * 2);
    ctx.fill();
    // Pointed hat
    ctx.fillStyle = '#6644aa';
    ctx.fillRect(-7, -20, 14, 5);
    ctx.fillRect(-11, -14, 22, 3);
    ctx.restore();
    // Label
    ctx.fillStyle = '#ccaa88';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎩 商人', room.cx, room.cy + 75);
  }
}

// === ROOM TRANSITIONS ===
function enterRoom(roomId) {
  currentRoomIdx = roomId;
  const room = getCurrentRoom();
  if (!room) return;
  room.explored = true;
  roomBounds = { x: room.x + 16, y: room.y + 16, w: room.w - 32, h: room.h - 32 };
  // Spawn player at center
  player.x = room.cx;
  player.y = room.cy;
  // If combat room and not cleared, spawn enemies
  if (room.type === ROOM_TYPE.COMBAT && !room.cleared) {
    spawnRoomEnemies(room);
  }
  // Boss room — start boss fight
  if (room.type === ROOM_TYPE.BOSS && !room.cleared) {
    const floorBosses = Object.keys(BOSS_DATA).filter(k => BOSS_DATA[k].floor === dungeon.floorNum);
    const bossType = floorBosses[randInt(0, floorBosses.length - 1)];
    startBossFight(bossType);
  }
}

function spawnRoomEnemies(room) {
  enemies = enemies.filter(e => e.alive);
  const count = 2 + Math.floor(Math.random() * 3) + dungeon.floorNum;
  const validTypes = Object.keys(ENEMY_DATA).filter(t => ENEMY_DATA[t].floor <= dungeon.floorNum);
  for (let i = 0; i < count; i++) {
    const type = validTypes[randInt(0, validTypes.length - 1)];
    const ex = room.x + 40 + Math.random() * (room.w - 80);
    const ey = room.y + 40 + Math.random() * (room.h - 80);
    const e = createEnemy(type, ex, ey);
    if (e) enemies.push(e);
  }
}

function checkDoorCollision() {
  const room = getCurrentRoom();
  if (!room) return;
  for (const door of room.doors) {
    const dx = player.x - door.x;
    const dy = player.y - door.y;
    if (Math.sqrt(dx*dx + dy*dy) < 20) {
      enterRoom(door.targetRoomId);
      return;
    }
  }
}

// === COLLISION DETECTION ===
function checkBulletEnemyCollisions() {
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const dx = b.x - enemy.x, dy = b.y - enemy.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < enemy.radius + 4) {
        // Shield check
        if (enemy.behavior === 'shield_front') {
          const hitAngle = Math.atan2(dy, dx);
          let angleDiff = hitAngle - enemy.state.facing;
          while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
          if (Math.abs(angleDiff) < Math.PI/2.5) continue;
        }
        enemy.takeDamage(b.damage);
        if (b.pierce <= 0) { bullets.splice(bi, 1); break; }
        else b.pierce--;
      }
    }
  }
}

function checkEnemyPlayerCollision(dt) {
  if (player.invincible > 0) return;
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    const dx = player.x - enemy.x, dy = player.y - enemy.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.radius + enemy.radius) {
      player.takeDamage(enemy.damage);
    }
  }
}

function checkEnemyBulletPlayerCollision() {
  if (player.invincible > 0) return;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    const dx = player.x - eb.x, dy = player.y - eb.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.radius + 5) {
      player.takeDamage(eb.damage);
      enemyBullets.splice(i, 1);
    }
  }
}

// === ENEMY BULLET UPDATE / RENDER ===
function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    if (eb.tracking) {
      const dx = player.x - eb.x, dy = player.y - eb.y;
      const tAngle = Math.atan2(dy, dx);
      const spd = Math.sqrt(eb.vx*eb.vx + eb.vy*eb.vy);
      eb.vx += Math.cos(tAngle) * spd * 2 * dt;
      eb.vy += Math.sin(tAngle) * spd * 2 * dt;
      const newSpd = Math.sqrt(eb.vx*eb.vx + eb.vy*eb.vy);
      const maxSpeed = 250;
      if (newSpd > maxSpeed) {
        eb.vx = (eb.vx / newSpd) * maxSpeed;
        eb.vy = (eb.vy / newSpd) * maxSpeed;
      }
    }
    if (eb.parabolic) {
      eb.vy += 300 * dt; // gravity
    }
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    eb.life -= dt;
  }
  enemyBullets = enemyBullets.filter(eb => eb.life > 0 &&
    eb.x > roomBounds.x - 100 && eb.x < roomBounds.x + roomBounds.w + 100 &&
    eb.y > roomBounds.y - 100 && eb.y < roomBounds.y + roomBounds.h + 100);
}

function renderEnemyBullets(ctx) {
  for (const eb of enemyBullets) {
    const color = eb.tracking ? '#ff4488' : (eb.parabolic ? '#888877' : '#ff6622');
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(eb.x, eb.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === LOOT DROP ===
function spawnDrop(x, y, type) {
  const item = { x, y, type, life: 30 };
  if (type === 'heart') { item.emoji = '❤️'; item.color = '#ff4444'; }
  else if (type === 'coin_pile') { item.emoji = '💰'; item.amount = 5+randInt(0,10); item.color = '#ffdd00'; }
  else if (type === 'energy') { item.emoji = '⚡'; item.color = '#44aaff'; }
  else if (type === 'weapon') { /* filled by spawnRandomWeapon */ }
  drops.push(item);
}

function spawnRandomWeapon(x, y) {
  const wTypes = Object.keys(WEAPONS);
  const wType = wTypes[randInt(0, wTypes.length-1)];
  const hasAffix = Math.random() < 0.6;
  const affix = hasAffix ? Object.keys(AFFIXES)[randInt(0, Object.keys(AFFIXES).length-1)] : null;
  drops.push({
    x, y, type: 'weapon',
    weaponType: wType,
    affix,
    emoji: WEAPONS[wType].emoji,
    color: affix ? AFFIXES[affix].color : WEAPONS[wType].color,
    life: 30,
    name: `${affix ? AFFIXES[affix].name : ''}${WEAPONS[wType].name}`
  });
}

function pickupItem(item) {
  switch (item.type) {
    case 'heart':
      player.hp = Math.min(player.maxHp, player.hp + 1);
      break;
    case 'coin_pile':
      player.coins += item.amount;
      break;
    case 'energy':
      player.skillTimer = Math.max(0, player.skillTimer - player.skillCooldown * 0.5);
      break;
    case 'weapon':
      if (player.weapons.length < 2) {
        player.weapons.push({ type: item.weaponType, affix: item.affix });
      } else {
        player.weapons[player.currentWeapon] = { type: item.weaponType, affix: item.affix };
      }
      const wInfo = WEAPONS[item.weaponType];
      const label = (item.affix ? '[' + AFFIXES[item.affix].name + ']' : '') + wInfo.name;
      showMessage('拾取武器: ' + label, 3000);
      break;
  }
}

function openShop() {
  gameState = STATE.SHOP;
  shopItems = [
    { type:'heart', name:'血包', price:10, emoji:'❤️' },
    { type:'weapon', name:'普通武器', price:30, weaponType:Object.keys(WEAPONS)[randInt(0,7)], affix:null, emoji:'🔫' },
    { type:'weapon', name:'附魔武器', price:60, weaponType:Object.keys(WEAPONS)[randInt(0,7)], affix:Object.keys(AFFIXES)[randInt(0,6)], emoji:'✨' },
    { type:'energy', name:'技能重置', price:15, emoji:'⚡' }
  ];
}

function buyShopItem(index) {
  const item = shopItems[index];
  if (!item) return;
  if (player.coins < item.price) return;
  player.coins -= item.price;
  switch (item.type) {
    case 'heart':
      player.hp = Math.min(player.maxHp, player.hp + 1);
      break;
    case 'weapon':
      if (player.weapons.length < 2) {
        player.weapons.push({ type: item.weaponType, affix: item.affix });
      } else {
        player.weapons[player.currentWeapon] = { type: item.weaponType, affix: item.affix };
      }
      break;
    case 'energy':
      player.skillTimer = 0;
      break;
  }
  showMessage('购买: ' + item.name, 2000);
  shopItems.splice(index, 1);
}

// === HELPER: UI message queue ===
function showMessage(text, duration) {
  messageQueue.push({ text, timer: duration / 1000 });
}

// === HELPER: Screen flash overlay ===
function flashScreen(duration) {
  flashAlpha = Math.max(flashAlpha, duration);
}

// === HELPER: Save high score ===
function saveHighScore() {
  try {
    const scores = JSON.parse(localStorage.getItem('pixelKnightScores') || '[]');
    scores.push({ score: player.coins, date: new Date().toISOString() });
    scores.sort((a, b) => b.score - a.score);
    localStorage.setItem('pixelKnightScores', JSON.stringify(scores.slice(0, 10)));
  } catch(e) {}
}

const SFX = {
  bossExplosion() { /* placeholder for sound effect */ }
};

// === BULLET UPDATE / RENDER ===
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < roomBounds.x - 50 || b.x > roomBounds.x + roomBounds.w + 50 ||
        b.y < roomBounds.y - 50 || b.y > roomBounds.y + roomBounds.h + 50) {
      bullets.splice(i, 1);
    }
  }
}

function renderBullets(ctx) {
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.isMelee ? 0 : 3, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.fillStyle = b.color.replace('ff','aa');
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === BOSS BULLETS UPDATE / RENDER ===
function updateBossBullets(dt) {
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    const bb = bossBullets[i];
    if (bb.parabolic) { bb.vy += 300 * dt; }
    if (bb.tracking) {
      const dx = player.x - bb.x, dy = player.y - bb.y;
      const tAngle = Math.atan2(dy, dx);
      const lerpFactor = 3 * dt;
      bb.vx += Math.cos(tAngle) * (bb.baseSpeed || 200) * lerpFactor;
      bb.vy += Math.sin(tAngle) * (bb.baseSpeed || 200) * lerpFactor;
      const spd = Math.sqrt(bb.vx*bb.vx + bb.vy*bb.vy);
      const maxSpd = (bb.baseSpeed || 200) * 1.5;
      if (spd > maxSpd) { bb.vx = (bb.vx / spd) * maxSpd; bb.vy = (bb.vy / spd) * maxSpd; }
    }
    bb.x += bb.vx * dt;
    bb.y += bb.vy * dt;
    bb.life -= dt;
    // Check stone wall collision for boss bullets
    let hitWall = false;
    for (const sw of stoneWalls) {
      if (bb.x > sw.x - sw.w/2 && bb.x < sw.x + sw.w/2 &&
          bb.y > sw.y - sw.h/2 && bb.y < sw.y + sw.h/2) {
        hitWall = true; break;
      }
    }
    if (bb.life <= 0 || hitWall ||
        bb.x < roomBounds.x - 100 || bb.x > roomBounds.x + roomBounds.w + 100 ||
        bb.y < roomBounds.y - 100 || bb.y > roomBounds.y + roomBounds.h + 100) {
      bossBullets.splice(i, 1);
    }
  }
}

function renderBossBullets(ctx) {
  for (const bb of bossBullets) {
    ctx.fillStyle = bb.color || '#ff4444';
    ctx.beginPath();
    ctx.arc(bb.x, bb.y, 4, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    if (bb.color) {
      ctx.fillStyle = bb.color.replace('ff', '66');
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// === BOSS CLONES UPDATE / RENDER (shadow_lord) ===
function updateBossClones(dt) {
  for (const clone of bossClones) {
    clone.life -= dt * 0.5;
  }
  bossClones = bossClones.filter(c => c.life > 0);
}

function renderBossClones(ctx) {
  for (const clone of bossClones) {
    ctx.save();
    ctx.globalAlpha = clone.alpha;
    ctx.fillStyle = clone.color;
    ctx.fillRect(clone.x - clone.radius, clone.y - clone.radius, clone.radius * 2, clone.radius * 2);
    ctx.restore();
  }
}

// === TENTACLE ZONES UPDATE / RENDER (vine_behemoth) ===
function updateTentacleZones(dt) {
  for (let i = tentacleZones.length - 1; i >= 0; i--) {
    const tz = tentacleZones[i];
    tz.timer -= dt;
    if (tz.timer <= 0) { tentacleZones.splice(i, 1); continue; }
    // Check player collision
    const dx = player.x - tz.x, dy = player.y - tz.y;
    if (Math.sqrt(dx*dx + dy*dy) < tz.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderTentacleZones(ctx) {
  for (const tz of tentacleZones) {
    ctx.save();
    ctx.globalAlpha = tz.timer;
    ctx.fillStyle = '#44aa44';
    ctx.beginPath();
    ctx.arc(tz.x, tz.y, tz.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#88cc88';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// === SPORE ZONES UPDATE / RENDER (vine_behemoth) ===
function updateSporeZones(dt) {
  for (let i = sporeZones.length - 1; i >= 0; i--) {
    const sz = sporeZones[i];
    sz.life -= dt;
    if (sz.life <= 0) { sporeZones.splice(i, 1); continue; }
    const dx = player.x - sz.x, dy = player.y - sz.y;
    if (Math.sqrt(dx*dx + dy*dy) < sz.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderSporeZones(ctx) {
  for (const sz of sporeZones) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#66cc66';
    ctx.beginPath();
    ctx.arc(sz.x, sz.y, sz.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// === LIGHTNING PILLARS UPDATE / RENDER (thunder_lord) ===
function updateLightningPillars(dt) {
  for (let i = lightningPillars.length - 1; i >= 0; i--) {
    const lp = lightningPillars[i];
    lp.life -= dt;
    if (lp.life <= 0) { lightningPillars.splice(i, 1); continue; }
    const dx = player.x - lp.x, dy = player.y - lp.y;
    if (Math.sqrt(dx*dx + dy*dy) < lp.radius + player.radius)
      player.takeDamage(1);
  }
}

function renderLightningPillars(ctx) {
  for (const lp of lightningPillars) {
    ctx.save();
    ctx.globalAlpha = lp.life / 2.0;
    ctx.strokeStyle = '#ffdd00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y - 60);
    ctx.lineTo(lp.x, lp.y + 40);
    ctx.stroke();
    // Branches
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y - 20);
    ctx.lineTo(lp.x - 12, lp.y);
    ctx.moveTo(lp.x, lp.y);
    ctx.lineTo(lp.x + 10, lp.y + 15);
    ctx.stroke();
    ctx.restore();
  }
}

// === STONE WALLS UPDATE / RENDER (ancient_golem) ===
function updateStoneWalls(dt) {
  for (let i = stoneWalls.length - 1; i >= 0; i--) {
    const sw = stoneWalls[i];
    sw.life -= dt * 0.5;
    if (sw.life <= 0) { stoneWalls.splice(i, 1); continue; }
    // Block player bullets hitting walls
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (b.x > sw.x - sw.w/2 && b.x < sw.x + sw.w/2 &&
          b.y > sw.y - sw.h/2 && b.y < sw.y + sw.h/2) {
        bullets.splice(bi, 1);
      }
    }
  }
}

function renderStoneWalls(ctx) {
  for (const sw of stoneWalls) {
    ctx.save();
    ctx.globalAlpha = sw.life / 4;
    ctx.fillStyle = '#666655';
    ctx.fillRect(sw.x - sw.w/2, sw.y - sw.h/2, sw.w, sw.h);
    ctx.strokeStyle = '#888877';
    ctx.lineWidth = 3;
    ctx.strokeRect(sw.x - sw.w/2, sw.y - sw.h/2, sw.w, sw.h);
    ctx.restore();
  }
}

// === BOSS COLLISION ===
function checkBulletBossCollision() {
  if (!boss || !boss.alive) return;
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    const dx = b.x - boss.x, dy = b.y - boss.y;
    if (Math.sqrt(dx*dx + dy*dy) < boss.radius + 6) {
      boss.takeDamage(b.damage);
      bullets.splice(bi, 1);
    }
  }
}

function checkBossBulletPlayerCollision() {
  if (player.invincible > 0) return;
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    const bb = bossBullets[i];
    const dx = player.x - bb.x, dy = player.y - bb.y;
    if (Math.sqrt(dx*dx + dy*dy) < player.radius + 5) {
      // Web bullet applies slow
      if (bb.color === '#cccccc') { slowTimer = 2.0; }
      player.takeDamage(bb.damage);
      bossBullets.splice(i, 1);
    }
  }
}

function checkBossPlayerCollision() {
  if (!boss || !boss.alive) return;
  if (player.invincible > 0) return;
  const dx = player.x - boss.x, dy = player.y - boss.y;
  if (Math.sqrt(dx*dx + dy*dy) < player.radius + boss.radius) {
    player.takeDamage(1);
  }
}

function checkBossClonesPlayerCollision() {
  for (let i = bossClones.length - 1; i >= 0; i--) {
    const c = bossClones[i];
    const dx = player.x - c.x, dy = player.y - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < player.radius + c.radius) {
      player.takeDamage(1);
    }
  }
}

// === GAME LOOP ===
let lastTime = 0;
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  if (lastTime === 0) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.016;
  lastTime = timestamp;
  update(dt);
  render();
}
// Main update/render — player + camera driving the game loop
function update(dt) {
  // UI overlay updates
  flashAlpha = Math.max(0, flashAlpha - dt);
  slowTimer = Math.max(0, slowTimer - dt);

  // Update message queue
  for (let i = messageQueue.length - 1; i >= 0; i--) {
    messageQueue[i].timer -= dt;
    if (messageQueue[i].timer <= 0) messageQueue.splice(i, 1);
  }

  // Update drops lifetime
  for (let i = drops.length - 1; i >= 0; i--) {
    drops[i].life -= dt;
    if (drops[i].life <= 0) drops.splice(i, 1);
  }

  // Weapon switch keys (only when playing)
  if (gameState === STATE.PLAYING || gameState === STATE.BOSS) {
    if (keys['Digit1']) { keys['Digit1'] = false; switchWeapon(0); }
    if (keys['Digit2']) { keys['Digit2'] = false; switchWeapon(1); }
  }

  // === Shop buying keys (when in shop state) ===
  if (gameState === STATE.SHOP) {
    if (keys['Digit1']) { keys['Digit1'] = false; buyShopItem(0); }
    if (keys['Digit2']) { keys['Digit2'] = false; buyShopItem(1); }
    if (keys['Digit3']) { keys['Digit3'] = false; buyShopItem(2); }
    if (keys['Digit4']) { keys['Digit4'] = false; buyShopItem(3); }
  }

  // === E key: pickup drops / interact with shop / close shop ===
  if (keys['KeyE']) {
    keys['KeyE'] = false;
    if (gameState === STATE.PLAYING) {
      // Pickup nearby drops
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        const dx = player.x - d.x, dy = player.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < 40) {
          pickupItem(d);
          drops.splice(i, 1);
        }
      }
      // Shop interaction
      const room = getCurrentRoom();
      if (room && room.type === ROOM_TYPE.SHOP && !room.cleared) {
        const sx = room.cx, sy = room.cy + 40;
        const sdx = player.x - sx, sdy = player.y - sy;
        if (Math.sqrt(sdx*sdx + sdy*sdy) < 60) {
          openShop();
        }
      }
    } else if (gameState === STATE.SHOP) {
      gameState = STATE.PLAYING;
    }
  }

  // Escape to close shop
  if (keys['Escape'] && gameState === STATE.SHOP) {
    keys['Escape'] = false;
    gameState = STATE.PLAYING;
  }

  player.update(dt);
  updateBullets(dt);

  // Boss update
  if (boss && boss.alive && gameState === STATE.BOSS) {
    boss.update(dt);
    updateBossBullets(dt);
    updateBossClones(dt);
    updateTentacleZones(dt);
    updateSporeZones(dt);
    updateLightningPillars(dt);
    updateStoneWalls(dt);
    checkBulletBossCollision();
    checkBossBulletPlayerCollision();
    checkBossPlayerCollision();
    checkBossClonesPlayerCollision();
    // Check boss defeat
    if (!boss.alive) { onBossDefeated(); }
  }

  // Enemy update
  enemies.forEach(e => e.update(dt));
  enemies = enemies.filter(e => e.alive);
  updateEnemyBullets(dt);
  // Collisions
  checkBulletEnemyCollisions();
  checkEnemyPlayerCollision(dt);
  checkEnemyBulletPlayerCollision();
  // Room cleared check (combat rooms only; boss handled by onBossDefeated)
  const room = getCurrentRoom();
  if (room && room.type === ROOM_TYPE.COMBAT && !room.cleared && enemies.filter(e => e.alive).length === 0) {
    room.cleared = true;
    if (Math.random() < 0.4) {
      const dt = Math.random() < 0.5 ? 'heart' : 'coin_pile';
      spawnDrop(room.cx, room.cy, dt);
    }
  }

  // Game over check
  if (player.hp <= 0 && gameState !== STATE.GAMEOVER && gameState !== STATE.VICTORY) {
    gameState = STATE.GAMEOVER;
    drops = [];
    shopItems = [];
    boss = null;
    bossBullets = [];
    bossClones = [];
    tentacleZones = [];
    sporeZones = [];
    lightningPillars = [];
    stoneWalls = [];
  }
  camera.update(dt);
}
function render() {
  ctx.clearRect(0, 0, GW, GH);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, GW, GH);
  // Camera-transformed game rendering
  camera.applyTransform(ctx);
  // Draw dungeon room
  renderRoom(ctx, getCurrentRoom());
  // Render enemies and enemy bullets
  enemies.forEach(e => e.render(ctx));
  renderEnemyBullets(ctx);
  player.render(ctx);
  renderBullets(ctx);

  // Boss rendering
  if (boss && boss.alive && gameState === STATE.BOSS) {
    renderBossBullets(ctx);
    renderTentacleZones(ctx);
    renderSporeZones(ctx);
    renderLightningPillars(ctx);
    renderStoneWalls(ctx);
    renderBossClones(ctx);
    boss.render(ctx);
  }

  // Drops rendering
  for (const d of drops) {
    if (d.life <= 0) continue;
    ctx.save();
    const pulse = 1 + Math.sin(Date.now() / 200 + d.x) * 0.1;
    ctx.translate(d.x, d.y);
    ctx.font = (18 * pulse) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = d.color || '#ffffff';
    ctx.globalAlpha = Math.min(d.life / 5, 1);
    ctx.fillText(d.emoji || '?', 0, 0);
    ctx.restore();
  }

  camera.restore(ctx);

  // === HUD (screen-space) ===
  // Boss HP bar (top-center)
  if (boss && boss.alive && gameState === STATE.BOSS) {
    const barW = 300, barH = 16, barX = GW/2 - barW/2, barY = 12;
    ctx.fillStyle = '#333333';
    ctx.fillRect(barX, barY, barW, barH);
    const hpRatio = boss.hp / boss.maxHp;
    ctx.fillStyle = hpRatio > 0.3 ? '#ff4444' : '#ff0000';
    ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(boss.name + ' ' + Math.ceil(boss.hp) + '/' + boss.maxHp, GW/2, barY + 13);
  }

  // HP
  ctx.fillStyle = '#ff4444';
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('❤️ ' + player.hp + '/' + player.maxHp, 16, 22);
  // Coins
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('💰 ' + player.coins, 16, 44);
  // Floor
  if (dungeon) {
    ctx.fillStyle = '#aaaacc';
    ctx.fillText('楼层: ' + dungeon.floorNum, 16, 66);
  }
  // Skill cooldown
  if (player.skillTimer > 0) {
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('技能: ' + player.skillTimer.toFixed(1) + 's', 16, 88);
  }

  // Weapon info
  const cwp = player.getWeapon();
  if (cwp) {
    const wd = WEAPONS[cwp.type];
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.fillText('武器: ' + wd.emoji + ' ' + wd.name + (cwp.affix ? ' [' + AFFIXES[cwp.affix].emoji + ']' : ''), 16, GH - 16);
    ctx.fillText('按 1/2 切换武器', 16, GH - 36);
  }

  // === SHOP UI ===
  if (gameState === STATE.SHOP) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, GW, GH);

    ctx.fillStyle = '#ffcc00';
    ctx.font = '26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('=== 商店 SHOP ===', GW/2, 70);

    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('💰 ' + player.coins, GW/2, 100);

    const startY = 140;
    const itemH = 70;
    for (let i = 0; i < shopItems.length; i++) {
      const si = shopItems[i];
      const iy = startY + i * itemH;

      // Item background
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(GW/2 - 180, iy, 360, itemH - 6);

      // Emoji + Name
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.font = '18px monospace';
      ctx.fillText(si.emoji + ' ' + si.name, GW/2 - 160, iy + 30);

      // Price
      ctx.textAlign = 'right';
      ctx.fillStyle = player.coins >= si.price ? '#ffcc00' : '#ff4444';
      ctx.fillText(si.price + '💰', GW/2 + 160, iy + 30);

      // Key hint
      ctx.textAlign = 'center';
      ctx.fillStyle = '#888888';
      ctx.font = '13px monospace';
      ctx.fillText('按 ' + (i+1) + ' 键购买', GW/2, iy + 55);
    }

    // Close hint
    ctx.fillStyle = '#888888';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('按 E 或 Esc 关闭', GW/2, GH - 50);
  }

  // === UI OVERLAYS ===
  // Screen flash (white overlay)
  if (flashAlpha > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(flashAlpha, 0.8) + ')';
    ctx.fillRect(0, 0, GW, GH);
  }

  // Message queue (center screen)
  if (messageQueue.length > 0) {
    const msg = messageQueue[0];
    ctx.fillStyle = '#ffcc00';
    ctx.font = '18px monospace';
    ctx.textAlign = 'center';
    const msgAlpha = Math.min(msg.timer, 0.5) / 0.5;
    ctx.globalAlpha = msgAlpha;
    ctx.fillText(msg.text, GW/2, GH/2 - 30);
    ctx.globalAlpha = 1;
  }

  // Slow effect indicator
  if (slowTimer > 0) {
    ctx.fillStyle = 'rgba(136,204,255,0.15)';
    ctx.fillRect(0, 0, GW, GH);
  }

  // Game Over overlay
  if (gameState === STATE.GAMEOVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, GW, GH);
    ctx.fillStyle = '#ff4444';
    ctx.font = '36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('你输了 / GAME OVER', GW/2, GH/2 - 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('刷新页面重新开始 / Refresh to restart', GW/2, GH/2 + 20);
  }

  // Victory overlay
  if (gameState === STATE.VICTORY) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, GW, GH);
    ctx.fillStyle = '#ffcc00';
    ctx.font = '36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('胜利！/ VICTORY!', GW/2, GH/2 - 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('得分 / Score: ' + player.coins + ' 💰', GW/2, GH/2 + 10);
    ctx.fillText('刷新页面重新开始 / Refresh to restart', GW/2, GH/2 + 40);
  }
}

// === GAME INIT ===
function initGame() {
  player.init('knight');
  dungeon = generateFloor(1);
  currentRoomIdx = dungeon.startRoomId;
  gameState = STATE.PLAYING;
  drops = [];
  shopItems = [];
  enterRoom(currentRoomIdx);
  console.log('Dungeon generated:', dungeon);
}

initGame();
requestAnimationFrame(gameLoop);
console.log('Pixel Knight — player ready');
</script>
